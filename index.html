<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench — trading desk</title>
<meta name="description" content="Trade journal, backtest bench, rulebook and learning portal.">
<meta name="theme-color" content="#0F1317">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BENCH — instrument-panel design tokens
   ============================================================ */
:root{
  --bg:#0F1317; --surface:#161C22; --raised:#1D242C; --sunk:#0B0F12;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --txt:#E6EBF0; --dim:#94A3B3; --faint:#66727F;
  --amber:#E8A33D; --amber-soft:rgba(232,163,61,.14);
  --cyan:#5BC8E8; --cyan-soft:rgba(91,200,232,.14);
  --up:#4FD1A1; --down:#F26D6D; --phos:#5FE3AE;
  --up-soft:rgba(79,209,161,.13); --down-soft:rgba(242,109,109,.13);
  --grat:rgba(255,255,255,.055);
  --font-d:'Archivo',system-ui,sans-serif;
  --font-b:'IBM Plex Sans',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
  --r:6px; --r-lg:10px; --r-sm:4px;
  --pad:clamp(14px,3vw,26px);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.32);
}
[data-theme="light"]{
  --bg:#EDF0F3; --surface:#FFFFFF; --raised:#F5F7F9; --sunk:#E4E8EC;
  --line:rgba(16,22,28,.10); --line-2:rgba(16,22,28,.20);
  --txt:#141A1F; --dim:#5A6773; --faint:#8A97A3;
  --amber:#B7761A; --amber-soft:rgba(183,118,26,.12);
  --cyan:#1E7E9E; --cyan-soft:rgba(30,126,158,.12);
  --up:#12855F; --down:#C63B3B; --phos:#12855F;
  --up-soft:rgba(18,133,95,.11); --down-soft:rgba(198,59,59,.11);
  --grat:rgba(16,22,28,.06);
  --shadow:0 1px 2px rgba(16,22,28,.06), 0 8px 20px rgba(16,22,28,.07);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:var(--font-b); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font-d);font-variation-settings:'wdth' 116;font-weight:700;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(21px,3.4vw,27px)}
h2{font-size:18px}
h3{font-size:15px;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--amber);text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
::selection{background:var(--amber-soft)}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}

/* silkscreen labels — the panel vernacular */
.eyebrow{
  font-family:var(--font-d);font-variation-settings:'wdth' 108;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100dvh}
.sidebar{
  background:var(--sunk);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto;
  padding:18px 12px calc(18px + env(safe-area-inset-bottom));
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:26px;height:26px;border-radius:5px;background:var(--amber);position:relative;flex:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.3) inset}
.brand-mark::after{content:"";position:absolute;inset:6px 5px;border-left:2px solid #0F1317;border-bottom:2px solid #0F1317}
.brand-name{font-family:var(--font-d);font-variation-settings:'wdth' 122;font-weight:800;font-size:17px;letter-spacing:.06em}
.navgroup{margin-bottom:14px}
.navgroup>.eyebrow{padding:0 10px 6px;display:block}
.navlink{
  display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;background:none;
  border-radius:var(--r);color:var(--dim);cursor:pointer;text-align:left;font-size:14.5px;
}
.navlink:hover{background:var(--raised);color:var(--txt)}
.navlink[aria-current="page"]{background:var(--amber-soft);color:var(--txt);font-weight:500}
.navlink[aria-current="page"] .ico{color:var(--amber)}
.ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.whoami{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);width:100%;border:0;background:none;cursor:pointer;color:var(--txt)}
.whoami:hover{background:var(--raised)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--raised);border:1px solid var(--line-2);
  display:grid;place-items:center;font-family:var(--font-m);font-size:12px;font-weight:600;color:var(--amber);flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex;align-items:center;gap:12px;min-height:56px;
}
.topbar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:var(--pad) var(--pad) 120px;max-width:1240px;width:100%;margin:0 auto;flex:1}

/* ---------- bottom tab bar (phones) ---------- */
.tabbar{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .view{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabbar{
    display:grid;grid-auto-flow:column;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--sunk) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;
    color:var(--faint);cursor:pointer;border-radius:var(--r);
    font-family:var(--font-d);font-variation-settings:'wdth' 106;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  }
  .tab[aria-current="page"]{color:var(--amber)}
  .tab .ico{width:20px;height:20px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2,.card-h h3{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)} .amber{color:var(--amber)} .cyan{color:var(--cyan)}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line);margin:14px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--raised);
  color:var(--txt);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;
  transition:background .13s ease,border-color .13s ease,transform .06s ease;
}
.btn:hover{background:color-mix(in srgb,var(--raised) 70%,var(--txt) 8%);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#12161B;font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--amber) 88%,#fff)}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--raised);color:var(--txt)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,transparent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{padding:8px;width:36px;height:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--raised);font-size:11.5px;color:var(--dim);
  font-family:var(--font-m);letter-spacing:.02em;
}
.chip.on{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 45%,transparent);color:var(--amber)}
.chip.cy{background:var(--cyan-soft);border-color:color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--cyan)}
.chip.win{background:var(--up-soft);border-color:color-mix(in srgb,var(--up) 40%,transparent);color:var(--up)}
.chip.loss{background:var(--down-soft);border-color:color-mix(in srgb,var(--down) 40%,transparent);color:var(--down)}
button.chip{cursor:pointer}

label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-family:var(--font-d);font-variation-settings:'wdth' 108;font-size:10px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
input,select,textarea{
  width:100%;padding:9px 11px;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r-sm);font-size:14.5px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
input[type=number],input[type=date],input[type=time]{font-family:var(--font-m)}
textarea{resize:vertical;min-height:78px;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--sunk);cursor:pointer}
.check input{width:17px;height:17px;flex:none;margin:1px 0 0;accent-color:var(--amber)}
.check.on{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amber-soft)}
.check>span{font-size:13.5px;line-height:1.45}

/* ---------- SIGNATURE: instrument readout ---------- */
.instr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.instr-top{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.scope{position:relative;background:var(--sunk);padding:0;height:clamp(150px,26vw,210px)}
.scope svg{display:block;width:100%;height:100%}
.trace{fill:none;stroke:var(--phos);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;
  filter:drop-shadow(0 0 5px color-mix(in srgb,var(--phos) 45%,transparent))}
[data-theme="light"] .trace{filter:none;stroke-width:2.1}
.trace-fill{fill:color-mix(in srgb,var(--phos) 11%,transparent);stroke:none}
.grat{stroke:var(--grat);stroke-width:1}
.zeroline{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
@media(prefers-reduced-motion:no-preference){
  .trace.sweep{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:sweep 1.1s cubic-bezier(.4,0,.2,1) forwards}
  .trace-fill.sweep{opacity:0;animation:fadein .5s .7s ease forwards}
}
@keyframes sweep{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.readout{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.cell{padding:11px 12px;border-right:1px solid var(--line);min-width:0}
.cell:last-child{border-right:0}
.cell .k{font-family:var(--font-d);font-variation-settings:'wdth' 106;font-size:9px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v{font-family:var(--font-m);font-size:clamp(15px,2.2vw,19px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media(max-width:760px){.readout{grid-template-columns:repeat(3,1fr)}
  .cell:nth-child(3){border-right:0}.cell:nth-child(-n+3){border-bottom:1px solid var(--line)}}

/* ---------- stat tiles ---------- */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.tile .k{font-family:var(--font-d);font-variation-settings:'wdth' 106;font-size:9.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
.tile .v{font-family:var(--font-m);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--dim);margin-top:2px}

/* ---------- bars ---------- */
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .4s ease}
.bar.g>i{background:var(--up)}

/* ---------- tables / lists ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--font-d);font-variation-settings:'wdth' 106;font-size:9.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--raised)}
.tbl td.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;text-align:right}
.tbl th.num{text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:640px){.tbl .opt{display:none}.tbl th,.tbl td{padding:9px 6px}}

.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}

.empty{text-align:center;padding:36px 20px;color:var(--dim)}
.empty .eyebrow{display:block;margin-bottom:8px}
.empty p{margin:6px 0 14px;font-size:14px;max-width:42ch;margin-inline:auto}

/* ---------- lock screen ---------- */
.lock{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--amber) 7%,transparent),transparent 60%),var(--bg)}
.lockbox{width:100%;max-width:380px}
.lockbox .brand{justify-content:center;padding-bottom:6px}
.lock-sub{text-align:center;color:var(--dim);font-size:13.5px;margin:0 0 22px}
.prof{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;margin-bottom:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;color:var(--txt)}
.prof:hover{border-color:var(--line-2);background:var(--raised)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(6,9,12,.62);backdrop-filter:blur(3px);
  display:grid;place-items:end center;padding:0}
@media(min-width:720px){.scrim{place-items:center;padding:24px}}
.sheet{
  background:var(--surface);border:1px solid var(--line);width:100%;max-width:620px;
  border-radius:14px 14px 0 0;max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);
  animation:rise .2s cubic-bezier(.32,.72,0,1);
}
@media(min-width:720px){.sheet{border-radius:var(--r-lg);max-height:88dvh;animation:pop .16s ease}}
@keyframes rise{from{transform:translateY(26px);opacity:.6}}
@keyframes pop{from{transform:scale(.98);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1}
.sheet-b{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:99;
  background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 16px;
  font-size:13.5px;box-shadow:var(--shadow);animation:rise .2s ease;max-width:88vw;text-align:center}
@media(min-width:901px){.toast{bottom:26px}}

/* ---------- video ---------- */
.vthumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;
  background:var(--sunk);border:1px solid var(--line);cursor:pointer;display:block;padding:0}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb::after{content:"";position:absolute;inset:0;background:rgba(8,11,14,.28)}
.vplay{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--amber);
  display:grid;place-items:center;z-index:2}
.vplay::after{content:"";border-left:14px solid #12161B;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r);background:#000;display:block}
.done-dot{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--line-2);flex:none;display:grid;place-items:center;
  background:none;cursor:pointer;padding:0}
.done-dot.on{background:var(--up);border-color:var(--up)}
.done-dot.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--sunk);border-bottom:2px solid var(--sunk);
  transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- misc ---------- */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;color:var(--dim);padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;
  font-size:13px;white-space:nowrap;font-weight:500}
.seg button.on{background:var(--raised);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.linkbtn{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);color:var(--txt);transition:border-color .13s,transform .06s}
.linkbtn:hover{border-color:var(--line-2);transform:translateY(-1px)}
.linkbtn .dot{width:9px;height:9px;border-radius:2px;flex:none}
.linkbtn .grow{flex:1;min-width:0}
.linkbtn .nm{font-weight:600;font-size:14.5px;display:block;color:var(--txt)}
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);
  border:1px solid color-mix(in srgb,var(--down) 40%,transparent);background:var(--down-soft);font-size:13.5px}
.banner.warn{border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:var(--amber-soft)}
details.term{border-bottom:1px solid var(--line)}
details.term summary{padding:11px 2px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.term summary::-webkit-details-marker{display:none}
details.term summary::after{content:"+";color:var(--faint);font-family:var(--font-m);font-size:16px;margin-left:auto}
details.term[open] summary::after{content:"–"}
details.term .body{padding:0 2px 14px;font-size:14px;color:var(--dim);line-height:1.6}
details.term .body p{margin:0 0 9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--faint);font-family:var(--font-d);font-variation-settings:'wdth' 106;font-size:9.5px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0;color:var(--dim)}
.hide{display:none !important}
</style>
</head>
<body>

function fmtDate(iso, style = 'short') {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d)) return iso;
  return style === 'long'
    ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function fmtR(r, dp = 2) {
  if (r == null || !isFinite(r)) return '—';
  return (r > 0 ? '+' : '') + r.toFixed(dp) + 'R';
}
function fmtMoney(v, cur = 'GBP') {
  if (v == null || !isFinite(v)) return '—';
  const s = new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(Math.abs(v));
  return (v < 0 ? '−' : '') + s;
}
function fmtPct(v, dp = 0) { return v == null || !isFinite(v) ? '—' : v.toFixed(dp) + '%'; }
function download(name, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- storage (falls back to memory in sandboxed previews) ---------- */

/* ---------- crypto (AES-GCM + PBKDF2, same shape as B.O.B.) ---------- */
const ENC = new TextEncoder(), DEC = new TextDecoder();
function toB64(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, saltB64, iterations = 250000) {
  const base = await crypto.subtle.importKey('raw', ENC.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: fromB64(saltB64), iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
  );
}
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, ENC.encode(JSON.stringify(obj)));
  return { v: 1, iv: toB64(iv), ct: toB64(ct) };
}
async function open_(key, blob) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.iv) }, key, fromB64(blob.ct));
  return JSON.parse(DEC.decode(pt));
}

/* ---------- profiles ---------- */
const Profiles = {
  all() { try { return JSON.parse(LS.getItem(K.profiles) || '[]'); } catch { return []; } },
  save(list) { LS.setItem(K.profiles, JSON.stringify(list)); },
  find(id) { return this.all().find(p => p.id === id); },
  async create(name, pass) {
    const salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
    const p = { id: uid(), name: name.trim(), salt, iter: 250000, created: new Date().toISOString() };
    const key = await deriveKey(pass, p.salt, p.iter);
    const list = this.all(); list.push(p); this.save(list);
    LS.setItem(K.data(p.id), JSON.stringify(await seal(key, freshState(p.name))));
    return { profile: p, key };
  },
  async unlock(id, pass) {
    const p = this.find(id); if (!p) throw new Error('Profile not found');
    const key = await deriveKey(pass, p.salt, p.iter);
    const raw = LS.getItem(K.data(id));
    if (!raw) return { profile: p, key, state: freshState(p.name) };
    let st;
    try { st = await open_(key, JSON.parse(raw)); }
    catch { throw new Error('WRONG_PASS'); }
    return { profile: p, key, state: migrate(st) };
  },
  remove(id) {
    this.save(this.all().filter(p => p.id !== id));
    LS.removeItem(K.data(id)); LS.removeItem(K.quick(id));
  }
};

/* ---------- quick unlock (device biometric / screen lock) ---------- */
const Quick = {
  supported() { return !!(window.PublicKeyCredential && navigator.credentials); },
  has(id) { return !!LS.getItem(K.quick(id)); },
  async enable(profile, key) {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: 'Bench', id: location.hostname },
        user: { id: ENC.encode(profile.id), name: profile.name, displayName: profile.name },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000, attestation: 'none'
      }
    });
    if (!cred) throw new Error('No credential');
    const raw = await crypto.subtle.exportKey('raw', key);
    const id = new Uint8Array(cred.rawId), out = new Uint8Array(raw);
    for (let i = 0; i < out.length; i++) out[i] ^= id[i % id.length];   // bind blob to this credential
    LS.setItem(K.quick(profile.id), JSON.stringify({ cred: toB64(cred.rawId), k: toB64(out) }));
  },
  disable(id) { LS.removeItem(K.quick(id)); },
  async unlock(profile) {
    const rec = JSON.parse(LS.getItem(K.quick(profile.id)));
    const got = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type: 'public-key', id: fromB64(rec.cred) }],
        userVerification: 'required', timeout: 60000
      }
    });
    if (!got) throw new Error('Cancelled');
    const id = new Uint8Array(got.rawId), out = fromB64(rec.k);
    for (let i = 0; i < out.length; i++) out[i] ^= id[i % id.length];
    const key = await crypto.subtle.importKey('raw', out, 'AES-GCM', true, ['encrypt', 'decrypt']);
    const st = await open_(key, JSON.parse(LS.getItem(K.data(profile.id))));
    return { key, state: migrate(st) };
  }
};

/* ---------- GitHub Gist sync ---------- */
const Gist = {
  async req(pat, path, opts = {}) {
    const r = await fetch('https://api.github.com' + path, {
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + pat,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.body ? { 'Content-Type': 'application/json' } : {})
      }
    });
    if (!r.ok) {
      const msg = r.status === 401 ? 'Token rejected. Check the token is valid and has the "gist" scope.'
        : r.status === 404 ? 'Gist not found for this token.'
        : 'GitHub returned ' + r.status + '.';
      throw new Error(msg);
    }
    return r.json();
  },
  file(profileId) { return 'bench-' + profileId + '.json'; },
  async create(pat, filename, content) {
    const g = await this.req(pat, '/gists', {
      method: 'POST',
      body: JSON.stringify({ description: 'Bench — encrypted trading journal', public: false, files: { [filename]: { content } } })
    });
    return g.id;
  },
  async push(pat, gistId, filename, content) {
    await this.req(pat, '/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [filename]: { content } } }) });
  },
  async pull(pat, gistId, filename) {
    const g = await this.req(pat, '/gists/' + gistId);
    const f = g.files[filename] || Object.values(g.files).find(x => x.filename.startsWith('bench-'));
    if (!f) throw new Error('No Bench file inside that gist.');
    if (f.truncated) { const r = await fetch(f.raw_url); return r.text(); }
    return f.content;
  }
};

/* ---------- state ---------- */
function freshState(name) {
  return {
    schema: APP.schema,
    updatedAt: new Date().toISOString(),
    owner: name,
    settings: {
      currency: 'GBP', account: 1000, riskPct: 1, theme: 'dark',
      maxDailyLossR: 3, maxTradesPerDay: 4, minSample: 100,
      sync: { pat: '', gistId: '', auto: true, lastPush: '', lastPull: '' }
    },
    plan: '',
    trades: [],
    runs: [],
    strategies: [],
    rules: STARTER_RULES.map(r => ({ id: uid(), text: r.text, category: r.category, mandatory: r.mandatory, active: true, created: new Date().toISOString() })),
    playlists: STARTER_PLAYLISTS.map(p => ({ id: uid(), title: p.title, note: p.note, videos: [] })),
    reviews: [],
    platforms: STARTER_PLATFORMS.map(p => ({ id: uid(), ...p })),
    terms: []
  };
}
function migrate(st) {
  st.schema = APP.schema;
  st.settings = Object.assign(freshState(st.owner || '').settings, st.settings || {});
  st.settings.sync = Object.assign({ pat: '', gistId: '', auto: true, lastPush: '', lastPull: '' }, st.settings.sync || {});
  for (const k of ['trades', 'runs', 'strategies', 'rules', 'playlists', 'reviews', 'platforms', 'terms'])
    if (!Array.isArray(st[k])) st[k] = [];
  if (typeof st.plan !== 'string') st.plan = '';
  return st;
}

/* ============================================================
   ANALYTICS
   ============================================================ */

/** R-multiple for a trade. Manual value wins; otherwise derived from entry/stop/exit. */
function tradeR(t) {
  const m = num(t.rManual);
  if (m !== null) return m;
  const e = num(t.entry), s = num(t.stop), x = num(t.exit);
  if (e === null || s === null || x === null || e === s) return null;
  const risk = Math.abs(e - s);
  const move = t.direction === 'Short' ? e - x : x - e;
  return move / risk;
}
function tradePnl(t, settings) {
  const m = num(t.pnlManual);
  if (m !== null) return m;
  const r = tradeR(t);
  const risked = num(t.riskAmount);
  if (r === null) return null;
  if (risked !== null) return r * risked - (num(t.fees) || 0);
  const acct = num(settings?.account), pct = num(settings?.riskPct);
  if (acct !== null && pct !== null) return r * (acct * pct / 100) - (num(t.fees) || 0);
  return null;
}
function outcomeOf(t) {
  if (t.status !== 'Closed') return 'Open';
  const r = tradeR(t);
  if (r === null) return 'Open';
  if (r > 0.05) return 'Win';
  if (r < -0.05) return 'Loss';
  return 'Break-even';
}

function stats(list, settings) {
  const closed = list.filter(t => t.status === 'Closed' && tradeR(t) !== null)
    .slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const rs = closed.map(tradeR);
  const wins = rs.filter(r => r > 0.05), losses = rs.filter(r => r < -0.05);
  const be = rs.length - wins.length - losses.length;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const totalR = sum(rs);
  const avgWin = wins.length ? sum(wins) / wins.length : null;
  const avgLoss = losses.length ? sum(losses) / losses.length : null;
  const grossW = sum(wins), grossL = Math.abs(sum(losses));

  // equity curve + drawdown, in R
  const curve = []; let acc = 0, peak = 0, maxDD = 0, ddNow = 0;
  for (const r of rs) { acc += r; curve.push(acc); peak = Math.max(peak, acc); ddNow = peak - acc; maxDD = Math.max(maxDD, ddNow); }

  // streaks
  let cw = 0, cl = 0, bw = 0, bl = 0;
  for (const r of rs) {
    if (r > 0.05) { cw++; cl = 0; bw = Math.max(bw, cw); }
    else if (r < -0.05) { cl++; cw = 0; bl = Math.max(bl, cl); }
    else { cw = 0; cl = 0; }
  }

  // rule adherence
  let followed = 0, checked = 0;
  for (const t of list) { if (t.rulesTotal) { checked += t.rulesTotal; followed += (t.rulesFollowed || []).length; } }

  const pnls = closed.map(t => tradePnl(t, settings)).filter(v => v !== null);

  return {
    n: closed.length, open: list.filter(t => t.status !== 'Closed').length,
    wins: wins.length, losses: losses.length, be,
    winRate: closed.length ? (wins.length / closed.length) * 100 : null,
    totalR, expectancy: closed.length ? totalR / closed.length : null,
    avgWin, avgLoss,
    payoff: avgWin !== null && avgLoss ? avgWin / Math.abs(avgLoss) : null,
    profitFactor: grossL > 0 ? grossW / grossL : (grossW > 0 ? Infinity : null),
    maxDD, ddNow, curve,
    bestWinStreak: bw, worstLossStreak: bl,
    adherence: checked ? (followed / checked) * 100 : null,
    pnl: pnls.length ? pnls.reduce((a, b) => a + b, 0) : null,
    best: rs.length ? Math.max(...rs) : null,
    worst: rs.length ? Math.min(...rs) : null
  };
}

/** Group trades by a key function and return sorted stat rows. */
function groupStats(list, keyFn, settings) {
  const map = new Map();
  for (const t of list) {
    const k = keyFn(t) || '—';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  }
  return [...map.entries()]
    .map(([k, v]) => ({ key: k, n: v.filter(t => t.status === 'Closed').length, ...stats(v, settings) }))
    .filter(r => r.n > 0)
    .sort((a, b) => b.totalR - a.totalR);
}

/* ---------- oscilloscope trace ---------- */
function scope(values, opts = {}) {
  const W = 600, H = 200, padY = 16;
  const grat = [];
  for (let i = 1; i < 8; i++) grat.push(`<line class="grat" x1="${(W / 8) * i}" y1="0" x2="${(W / 8) * i}" y2="${H}"/>`);
  for (let i = 1; i < 4; i++) grat.push(`<line class="grat" x1="0" y1="${(H / 4) * i}" x2="${W}" y2="${(H / 4) * i}"/>`);

  if (!values || values.length < 2) {
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="No data yet">
      ${grat.join('')}<line class="zeroline" x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}"/></svg>
      <div class="empty" style="position:absolute;inset:0;display:grid;place-content:center;padding:0">
        <span class="eyebrow">No signal</span><p class="small" style="margin:6px 0 0">Log a closed trade to start the trace.</p></div>`;
  }
  const series = [0, ...values];
  const lo = Math.min(0, ...series), hi = Math.max(0, ...series);
  const span = (hi - lo) || 1;
  const x = i => (i / (series.length - 1)) * W;
  const y = v => padY + (1 - (v - lo) / span) * (H - padY * 2);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const zero = y(0);
  const anim = opts.animate === false ? '' : ' data-sweep';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Equity curve in R">
    ${grat.join('')}
    <line class="zeroline" x1="0" y1="${zero.toFixed(1)}" x2="${W}" y2="${zero.toFixed(1)}"/>
    <polygon class="trace-fill"${anim} points="0,${zero.toFixed(1)} ${pts} ${W},${zero.toFixed(1)}"/>
    <polyline class="trace"${anim} points="${pts}"/>
  </svg>`;
}

/* ---------- mini bar for group tables ---------- */
function miniBar(v, max) {
  const pct = max > 0 ? clamp(Math.abs(v) / max * 100, 0, 100) : 0;
  const col = v >= 0 ? 'var(--up)' : 'var(--down)';
  return `<span style="display:inline-block;width:52px;height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;vertical-align:middle">
    <i style="display:block;height:100%;width:${pct}%;background:${col}"></i></span>`;
}

/** Modal sheet. Returns the sheet element; resolve/close via closeModal(). */
let modalResolve = null;
function modal({ title, body, footer, onOpen, wide }) {
  closeModal();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="max-width:900px"' : ''}>
    <div class="sheet-h"><h2>${esc(title)}</h2>
      <button class="btn icon ghost" data-act="modal.close" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">${body}</div>
    ${footer ? `<div class="sheet-f">${footer}</div>` : ''}
  </div>`;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeModal(); });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  const first = scrim.querySelector('input,select,textarea,button.primary');
  if (first && window.matchMedia('(min-width:901px)').matches) setTimeout(() => first.focus(), 60);
  onOpen && onOpen(scrim);
  return scrim;
}
function closeModal() {
  $$('.scrim').forEach(s => s.remove());
  document.body.style.overflow = '';
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(false); }
}
function confirmDialog(title, message, danger = 'Delete') {
  closeModal();
  return new Promise(res => {
    modal({
      title,
      body: `<p class="muted" style="margin:0">${esc(message)}</p>`,
      footer: `<button class="btn ghost" data-act="modal.close">Keep it</button>
               <button class="btn danger" data-act="modal.confirm">${esc(danger)}</button>`
    });
    modalResolve = res;   // set after modal(), so its own closeModal() cannot consume it
  });
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const sel = (name, val, opts) => `<select name="${name}">${opts.map(o => {
  const [v, l] = Array.isArray(o) ? o : [o, o];
  return `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(l)}</option>`;
}).join('')}</select>`;
function formData(scope) {
  const o = {};
  $$('input,select,textarea', scope).forEach(el => {
    if (!el.name) return;
    if (el.type === 'checkbox') { if (!Array.isArray(o[el.name])) o[el.name] = []; if (el.checked) o[el.name].push(el.value); }
    else o[el.name] = el.value.trim();
  });
  return o;
}

async function persist() {
  if (!S.key || !S.st) return;
  S.st.updatedAt = new Date().toISOString();
  try {
    LS.setItem(K.data(S.profile.id), JSON.stringify(await seal(S.key, S.st)));
    S.dirty = false;
  } catch (e) { toast('Could not save locally. Storage may be full.'); }
}
async function commit(fn) { fn && fn(); await persist(); render(); }

            <span class="tiny faint" id="syncState">Local only</span></span>
        </button>

    ${TABS.map(([r, l, ic]) => `<button class="tab" data-act="${r === 'more' ? 'more' : 'go'}" data-route="${r}">${icon(ic)}<span>${l}</span></button>`).join('')}
  </nav>`;
}

function render() {
  if (!$('#view')) renderShell();
  $$('.navlink[data-route]').forEach(b => b.setAttribute('aria-current', b.dataset.route === S.route ? 'page' : 'false'));
  $$('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.route === S.route ? 'page' : 'false'));
  const v = (VIEWS[S.route] || VIEWS.desk)();
  $('#viewTitle').textContent = v.title || TITLES[S.route] || APP.name;
  $('#viewActions').innerHTML = v.actions || '';
  $('#view').innerHTML = v.html;
  $('#view').scrollTop = 0;
  window.scrollTo({ top: 0 });
  startSweep();
  updateSyncBadge();
  v.after && v.after();
}
function go(route, params = {}) { S.route = route; S.params = params; render(); }
/** Draw the trace left to right using its measured length. */
function startSweep() {
  $$('[data-sweep]').forEach(p => {
    try { if (p.getTotalLength) p.style.setProperty('--len', Math.ceil(p.getTotalLength())); } catch (e) {}
    p.classList.add('sweep');
  });
}
function updateSyncBadge() {
  const el = $('#syncState'); if (!el) return;
  const sy = S.st.settings.sync;
  el.textContent = S.syncing ? 'Syncing…' : sy.gistId ? ('Synced ' + (sy.lastPush ? fmtDate(sy.lastPush.slice(0, 10)) : 'never')) : 'Local only';
}

/* ============================================================
   LOCK SCREEN
   ============================================================ */
function renderLock(mode = 'pick', ctx = {}) {
  const list = Profiles.all();
  const root = $('#root');
  const shellTop = `<div class="brand"><div class="brand-mark"></div><div class="brand-name">${APP.name}</div></div>`;

  if (mode === 'pick' && list.length === 0) mode = 'new';

  let body = '';
  if (mode === 'pick') {
    body = `<p class="lock-sub">Choose a profile to unlock.</p>
      ${list.map(p => `<button class="prof" data-act="pick" data-id="${p.id}">
          <span class="avatar">${esc((p.name || '?').slice(0, 2).toUpperCase())}</span>
          <span style="flex:1"><span style="display:block;font-weight:500">${esc(p.name)}</span>
          <span class="tiny faint">${Quick.has(p.id) ? 'Quick unlock ready' : 'Passphrase'}</span></span>
        </button>`).join('')}
      <button class="btn ghost" data-act="mode" data-mode="new" style="width:100%;margin-top:10px">${icon('plus')} New profile</button>
      <button class="btn ghost" data-act="mode" data-mode="restore" style="width:100%">${icon('sync')} Restore from GitHub</button>`;
  } else if (mode === 'unlock') {
    const p = Profiles.find(ctx.id);
    body = `<p class="lock-sub">Unlocking <strong>${esc(p.name)}</strong></p>
      <form id="unlockForm" class="stack">
        ${field('Passphrase', `<input type="password" name="pass" autocomplete="current-password" autofocus>`)}
        <div class="tiny down" id="lockErr"></div>
        <button class="btn primary" type="submit" style="width:100%">Unlock</button>
        ${Quick.has(p.id) ? `<button type="button" class="btn" data-act="quick" data-id="${p.id}" style="width:100%">${icon('lock')} Use device unlock</button>` : ''}
        <button type="button" class="btn ghost" data-act="mode" data-mode="pick" style="width:100%">Back</button>
      </form>`;
  } else if (mode === 'new') {
    body = `<p class="lock-sub">Your journal is encrypted with this passphrase. It is never sent anywhere and cannot be reset — write it down.</p>
      <form id="newForm" class="stack">
        ${field('Profile name', `<input name="name" autocomplete="nickname" placeholder="e.g. Emil" autofocus>`)}
        ${field('Passphrase', `<input type="password" name="pass" autocomplete="new-password">`)}
        ${field('Confirm passphrase', `<input type="password" name="pass2" autocomplete="new-password">`)}
        <div class="tiny down" id="lockErr"></div>
        <button class="btn primary" type="submit" style="width:100%">Create profile</button>
        ${list.length ? `<button type="button" class="btn ghost" data-act="mode" data-mode="pick" style="width:100%">Back</button>` : ''}
      </form>`;
  } else if (mode === 'restore') {
    body = `<p class="lock-sub">Pull an encrypted journal from a private gist onto this device.</p>
      <form id="restoreForm" class="stack">
        ${field('Profile name', `<input name="name" placeholder="Any name you like">`)}
        ${field('GitHub token', `<input type="password" name="pat" placeholder="ghp_… (gist scope)">`)}
        ${field('Gist ID', `<input name="gistId" placeholder="From the gist URL">`)}
        ${field('Passphrase', `<input type="password" name="pass">`)}
        <div class="tiny down" id="lockErr"></div>
        <button class="btn primary" type="submit" style="width:100%">Restore journal</button>
        <button type="button" class="btn ghost" data-act="mode" data-mode="pick" style="width:100%">Back</button>
      </form>`;
  }

  root.innerHTML = `<div class="lock"><div class="lockbox">${shellTop}${body}
    <p class="tiny faint" style="text-align:center;margin-top:22px">${LS._mem ? 'Preview mode — this browser is blocking storage, so nothing will be saved.' : 'Encrypted on this device with AES-GCM.'}</p>
  </div></div>`;

  const err = m => { const e = $('#lockErr'); if (e) e.textContent = m; };

  $('#unlockForm')?.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Unlocking…';
    try {
      const { profile, key, state } = await Profiles.unlock(ctx.id, formData(e.target).pass);
      boot(profile, key, state);
    } catch (ex) {
      err(ex.message === 'WRONG_PASS' ? 'That passphrase does not match.' : ex.message);
      btn.disabled = false; btn.textContent = 'Unlock';
    }
  });

  $('#newForm')?.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const d = formData(e.target);
    if (!d.name) return err('Give the profile a name.');
    if (d.pass.length < 8) return err('Use at least 8 characters.');
    if (d.pass !== d.pass2) return err('The two passphrases do not match.');
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Creating…';
    const { profile, key } = await Profiles.create(d.name, d.pass);
    const st = (await Profiles.unlock(profile.id, d.pass)).state;
    boot(profile, key, st);
  });

  $('#restoreForm')?.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const d = formData(e.target);
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Restoring…';
    try {
      const raw = await Gist.pull(d.pat, d.gistId.trim(), '');
      const pkg = JSON.parse(raw);
      const key = await deriveKey(d.pass, pkg.salt, pkg.iter || 250000);
      const state = migrate(await open_(key, pkg.blob));
      const p = { id: uid(), name: d.name || state.owner || 'Restored', salt: pkg.salt, iter: pkg.iter || 250000, created: new Date().toISOString() };
      const all = Profiles.all(); all.push(p); Profiles.save(all);
      state.settings.sync.pat = d.pat; state.settings.sync.gistId = d.gistId.trim();
      LS.setItem(K.data(p.id), JSON.stringify(await seal(key, state)));
      boot(p, key, state);
      toast('Journal restored.');
    } catch (ex) {
      err(ex.name === 'OperationError' ? 'Passphrase does not match that gist.' : ex.message);
      btn.disabled = false; btn.textContent = 'Restore journal';
    }
  });

  root.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'pick') renderLock('unlock', { id: b.dataset.id });
    if (b.dataset.act === 'mode') renderLock(b.dataset.mode);
    if (b.dataset.act === 'quick') doQuickUnlock(b.dataset.id);
  };
}

async function doQuickUnlock(id) {
  const p = Profiles.find(id);
  try { const { key, state } = await Quick.unlock(p); boot(p, key, state); }
  catch (e) { toast('Device unlock cancelled — use your passphrase.'); }
}
function boot(profile, key, state) {
  $('#root').onclick = null;
  S.profile = profile; S.key = key; S.st = state;
  LS.setItem(K.last, profile.id);
  applyTheme(state.settings.theme);
  renderShell(); go('desk');
  if (state.settings.sync.gistId && state.settings.sync.pat && state.settings.sync.auto) setTimeout(() => syncPull(true), 800);
}
function lockApp() { S.profile = null; S.key = null; S.st = null; renderLock('pick'); }
function applyTheme(t) {
  document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
  $('meta[name=theme-color]')?.setAttribute('content', t === 'light' ? '#EDF0F3' : '#0F1317');
  LS.setItem(K.theme, t);
}

   ============================================================ */
const VIEWS = {};

/* ---------- DESK ---------- */
VIEWS.desk = () => {
  const st = S.st, set = st.settings;
  const mode = S.params.mode || 'live';
  const pool = mode === 'all' ? st.trades : st.trades.filter(t => (t.mode || 'live') === mode);
  const s = stats(pool, set);

  const today = todayISO();
  const todays = st.trades.filter(t => t.date === today && (t.mode || 'live') === 'live');
  const todayR = todays.filter(t => t.status === 'Closed').reduce((a, t) => a + (tradeR(t) || 0), 0);
  const overLoss = todayR <= -Math.abs(set.maxDailyLossR);
  const overCount = todays.length >= set.maxTradesPerDay;

  const recent = st.trades.slice().sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))).slice(0, 6);
  const byStrat = groupStats(pool, t => strategyName(t.strategyId), set).slice(0, 5);
  const maxAbs = Math.max(1, ...byStrat.map(r => Math.abs(r.totalR)));

  const wkStart = new Date(); wkStart.setDate(wkStart.getDate() - ((wkStart.getDay() + 6) % 7));
  const wkISO = wkStart.toLocaleDateString('en-CA');
  const weekR = st.trades.filter(t => t.date >= wkISO && t.status === 'Closed' && (t.mode || 'live') === 'live')
    .reduce((a, t) => a + (tradeR(t) || 0), 0);

  return {
    title: 'Desk',
    actions: `<button class="btn primary" data-act="trade.new">${icon('plus')} Log trade</button>`,
    html: `
    ${(overLoss || overCount) ? `<div class="banner" style="margin-bottom:14px">${icon('lock')}
      <div><strong>Stop for today.</strong> ${overLoss ? `You are at ${fmtR(todayR)} against a ${set.maxDailyLossR}R daily limit.` : `You have taken ${todays.length} trades against a limit of ${set.maxTradesPerDay}.`}
      The limit exists because the next trade is the expensive one.</div></div>` : ''}

    <div class="instr" style="position:relative">
      <div class="instr-top">
        <span class="eyebrow">Equity trace · R</span>
        <div class="spacer"></div>
        <div class="seg">
          ${[['live', 'Live'], ['backtest', 'Backtest'], ['all', 'All']].map(([v, l]) =>
            `<button class="${mode === v ? 'on' : ''}" data-act="desk.mode" data-mode="${v}">${l}</button>`).join('')}
        </div>
      </div>
      <div class="scope">${scope(s.curve)}</div>
      <div class="readout">
        <div class="cell"><span class="k">Net</span><span class="v ${s.totalR >= 0 ? 'up' : 'down'}">${s.n ? fmtR(s.totalR, 1) : '—'}</span></div>
        <div class="cell"><span class="k">Expectancy</span><span class="v">${s.expectancy != null ? fmtR(s.expectancy) : '—'}</span></div>
        <div class="cell"><span class="k">Win rate</span><span class="v">${fmtPct(s.winRate)}</span></div>
        <div class="cell"><span class="k">Profit factor</span><span class="v">${s.profitFactor == null ? '—' : (s.profitFactor === Infinity ? '∞' : s.profitFactor.toFixed(2))}</span></div>
        <div class="cell"><span class="k">Max drawdown</span><span class="v down">${s.n ? '−' + s.maxDD.toFixed(1) + 'R' : '—'}</span></div>
        <div class="cell"><span class="k">Adherence</span><span class="v ${s.adherence != null && s.adherence < 90 ? 'down' : ''}">${fmtPct(s.adherence)}</span></div>
      </div>
    </div>

    <div class="grid g3" style="margin-top:14px">
      <div class="tile"><span class="k">Trades logged</span><span class="v">${s.n}</span><span class="s">${s.wins}W · ${s.losses}L · ${s.be}BE${s.open ? ` · ${s.open} open` : ''}</span></div>
      <div class="tile"><span class="k">This week (live)</span><span class="v ${weekR >= 0 ? 'up' : 'down'}">${fmtR(weekR, 1)}</span><span class="s">${todays.length} trade${todays.length === 1 ? '' : 's'} today</span></div>
      <div class="tile"><span class="k">Estimated P&amp;L</span><span class="v ${(s.pnl || 0) >= 0 ? 'up' : 'down'}">${fmtMoney(s.pnl, set.currency)}</span><span class="s">at ${set.riskPct}% of ${fmtMoney(set.account, set.currency)}</span></div>
      <div class="tile"><span class="k">Worst streak</span><span class="v">${s.worstLossStreak || 0}</span><span class="s">best run ${s.bestWinStreak || 0} wins</span></div>
    </div>

    <div class="grid g2" style="margin-top:14px">
      <div class="card">
        <div class="card-h"><span class="eyebrow">Latest</span><div class="spacer"></div>
          <button class="btn sm ghost" data-act="go" data-route="trades">All trades</button></div>
        ${recent.length ? recent.map(t => tradeRow(t)).join('') : emptyState('Nothing logged yet', 'Log your first trade and the trace starts drawing.', 'Log trade', 'trade.new')}
      </div>
      <div class="card">
        <div class="card-h"><span class="eyebrow">By strategy</span><div class="spacer"></div>
          <button class="btn sm ghost" data-act="go" data-route="playbook">Playbook</button></div>
        ${byStrat.length ? `<table class="tbl"><tbody>${byStrat.map(r => `
          <tr data-act="noop"><td>${esc(r.key)}</td>
            <td style="width:60px">${miniBar(r.totalR, maxAbs)}</td>
            <td class="num ${r.totalR >= 0 ? 'up' : 'down'}">${fmtR(r.totalR, 1)}</td>
            <td class="num faint">${r.n}</td></tr>`).join('')}</tbody></table>`
          : emptyState('No strategy data', 'Tag your trades with a strategy to see which one actually pays.', 'Add a strategy', 'strategy.new')}
      </div>
    </div>`
  };
};

function emptyState(title, msg, btnLabel, act) {
  return `<div class="empty"><span class="eyebrow">${esc(title)}</span><p>${esc(msg)}</p>
    ${btnLabel ? `<button class="btn" data-act="${act}">${btnLabel}</button>` : ''}</div>`;
}
function strategyName(id) {
  if (!id) return 'Untagged';
  return S.st.strategies.find(s => s.id === id)?.name || 'Untagged';
}
function tradeRow(t) {
  const r = tradeR(t), oc = outcomeOf(t);
  const cls = oc === 'Win' ? 'win' : oc === 'Loss' ? 'loss' : '';
  return `<div class="item" data-act="trade.open" data-id="${t.id}" style="cursor:pointer">
    <span class="chip ${(t.mode || 'live') === 'backtest' ? 'cy' : 'on'}" style="min-width:0">${(t.mode || 'live') === 'backtest' ? 'BT' : t.direction === 'Short' ? 'S' : 'L'}</span>
    <div class="grow">
      <div style="font-weight:500;font-size:14px">${esc(t.instrument || 'Untitled')}</div>
      <div class="tiny faint">${fmtDate(t.date)}${t.time ? ' · ' + esc(t.time) : ''} · ${esc(strategyName(t.strategyId))}</div>
    </div>
    <span class="mono ${r == null ? 'faint' : r >= 0 ? 'up' : 'down'}" style="font-size:14px">${t.status === 'Closed' ? fmtR(r) : 'open'}</span>

}

/* ---------- TRADES ---------- */
VIEWS.trades = () => {

    html: `

        ${st.strategies.map(x => `<button class="chip ${strat === x.id ? 'on' : ''}" data-act="trades.filter" data-k="strat" data-v="${x.id}">${esc(x.name)}</button>`).join('')}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    onOpen(scrim) {
      const f = $('#tradeForm', scrim);
      const recalc = () => {
        const v = formData(f);
        const e = num(v.entry), s = num(v.stop), tg = num(v.target), x = num(v.exit);
        const risk = e != null && s != null ? Math.abs(e - s) : null;
        $('#calcRR', scrim).textContent = (risk && tg != null) ? (Math.abs(tg - e) / risk).toFixed(2) + ':1' : '—';
        const r = tradeR({ ...v, rManual: v.rManual });
        $('#calcR', scrim).textContent = r == null ? '—' : fmtR(r);
        $('#calcR', scrim).className = 'v mono ' + (r == null ? '' : r >= 0 ? 'up' : 'down');
        const risked = num(v.riskAmount) ?? (set.account * set.riskPct / 100);
        $('#calcCash', scrim).textContent = r == null ? '—' : fmtMoney(r * risked - (num(v.fees) || 0), set.currency);

        if (rc) { const n = $$('input[name=rulesFollowed]:checked', f).length, tot = $$('input[name=rulesFollowed]', f).length; rc.textContent = `${n} of ${tot} followed`; }
      };
      f.addEventListener('input', e => {
        if (e.target.type === 'checkbox') e.target.closest('.check').classList.toggle('on', e.target.checked);
        recalc();
      });
      f.addEventListener('change', recalc);
      recalc();
    }
  });
}

function readTradeForm() {
  const f = $('#tradeForm'); if (!f) return null;
  const v = formData(f);
  v.tags = (v.tags || '').split(',').map(s => s.trim()).filter(Boolean);
  v.mistakes = (v.mistakes || '').split(',').map(s => s.trim()).filter(Boolean);
  v.rulesChecked = (v.rulesChecked || '').split(',').filter(Boolean);
  v.rulesFollowed = v.rulesFollowed || [];
  v.rulesTotal = v.rulesChecked.length;
  if (v.status === 'Open' && (v.exit !== '' || v.rManual !== '')) v.status = 'Closed';
  return v;
}

VIEWS.bench = () => {
  const st = S.st, set = st.settings;
  if (S.params.run) return benchRunView(S.params.run);

  const rows = st.runs.map(r => {
    const list = st.trades.filter(t => t.runId === r.id);
    return { run: r, s: stats(list, set) };
  }).sort((a, b) => (b.run.created || '').localeCompare(a.run.created || ''));

  return {
    title: 'Backtest bench',
    actions: `<button class="btn primary" data-act="run.new">${icon('plus')} New test</button>`,
    html: `
    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="eyebrow">How this works</span></div>
      <p class="small muted" style="margin:0">A test is one strategy, one instrument set, one fixed rule set, run over a defined period. Log every trade the rules would have taken — including the losers you would rather forget — then let the numbers decide whether it goes live. ${set.minSample} closed trades is the bar set in your settings.</p>
    </div>
    ${rows.length ? `<div class="grid g2">${rows.map(({ run, s }) => {
      const done = s.n, pct = clamp(done / set.minSample * 100, 0, 100);
      return `<button class="card" data-act="run.open" data-id="${run.id}" style="text-align:left;cursor:pointer;border-color:var(--line)">
        <div class="card-h"><h3>${esc(run.name)}</h3>
          <span class="chip ${run.status === 'Complete' ? 'win' : run.status === 'Abandoned' ? 'loss' : 'cy'}">${esc(run.status)}</span></div>
        <div class="tiny faint" style="margin:-6px 0 10px">${esc(strategyName(run.strategyId))} · ${esc(run.market || 'any market')} · ${esc(run.timeframe || '—')}</div>
        <div class="row" style="gap:16px;margin-bottom:10px">
          <span><span class="k eyebrow">Net</span><br><span class="mono ${s.totalR >= 0 ? 'up' : 'down'}" style="font-size:17px">${s.n ? fmtR(s.totalR, 1) : '—'}</span></span>
          <span><span class="k eyebrow">Expectancy</span><br><span class="mono" style="font-size:17px">${s.expectancy != null ? fmtR(s.expectancy) : '—'}</span></span>

        </div>

        <div class="tiny faint" style="margin-top:5px">${done} of ${set.minSample} trades toward a usable sample</div>
      </button>`; }).join('')}</div>`
      : emptyState('No tests on the bench', 'Pick a strategy, define the period, and log what the rules would have done.', 'Start a test', 'run.new')}`
  };
};

function benchRunView(runId) {
  const st = S.st, set = st.settings;
  const run = st.runs.find(r => r.id === runId);
  if (!run) { S.params = {}; return VIEWS.bench(); }
  const list = st.trades.filter(t => t.runId === run.id)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const s = stats(list, set);

  let verdict, vclass;
  if (s.n < 30) { verdict = `Too early. ${s.n} trades tells you almost nothing — anything can look good over 30.`; vclass = 'warn'; }
  else if (s.n < set.minSample) { verdict = `Building. ${s.n} of ${set.minSample}. Keep logging before drawing a conclusion.`; vclass = 'warn'; }
  else if (s.expectancy > 0.1 && s.profitFactor > 1.2) { verdict = `Candidate. Positive expectancy over ${s.n} trades. Forward test on a demo before risking money.`; vclass = 'ok'; }
  else if (s.expectancy > 0) { verdict = `Marginal. The edge is real but thin — costs and slippage could eat all of it.`; vclass = 'warn'; }
  else { verdict = `Negative expectancy over ${s.n} trades. This one does not go live.`; vclass = 'bad'; }

  return {
    title: run.name,
    actions: `<button class="btn sm ghost" data-act="go" data-route="bench">${icon('back')} All tests</button>
              <button class="btn sm" data-act="run.edit" data-id="${run.id}">Edit test</button>`,
    html: `
    <div class="banner ${vclass === 'ok' ? '' : 'warn'}" style="margin-bottom:14px;${vclass === 'ok' ? 'border-color:color-mix(in srgb,var(--up) 40%,transparent);background:var(--up-soft)' : ''}">
      ${icon('bench')}<div><strong>${vclass === 'ok' ? 'Passes the bar.' : vclass === 'bad' ? 'Fails.' : 'Not yet.'}</strong> ${esc(verdict)}</div></div>

    <div class="instr">
      <div class="instr-top"><span class="eyebrow">${esc(strategyName(run.strategyId))} · ${esc(run.market || 'any')} · ${esc(run.timeframe || '—')}</span>
        <div class="spacer"></div><span class="tiny faint mono">${esc(run.from || '?')} → ${esc(run.to || '?')}</span></div>
      <div class="scope">${scope(s.curve)}</div>
      <div class="readout">
        <div class="cell"><span class="k">Net</span><span class="v ${s.totalR >= 0 ? 'up' : 'down'}">${s.n ? fmtR(s.totalR, 1) : '—'}</span></div>
        <div class="cell"><span class="k">Expectancy</span><span class="v">${s.expectancy != null ? fmtR(s.expectancy) : '—'}</span></div>
        <div class="cell"><span class="k">Win rate</span><span class="v">${fmtPct(s.winRate)}</span></div>
        <div class="cell"><span class="k">Payoff</span><span class="v">${s.payoff ? s.payoff.toFixed(2) : '—'}</span></div>
        <div class="cell"><span class="k">Max DD</span><span class="v down">${s.n ? '−' + s.maxDD.toFixed(1) + 'R' : '—'}</span></div>
        <div class="cell"><span class="k">Worst run</span><span class="v">${s.worstLossStreak || 0}L</span></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h"><span class="eyebrow">Fast entry</span><div class="spacer"></div>
        <button class="btn sm ghost" data-act="trade.new" data-run="${run.id}">Full form</button></div>
      <form id="quickForm" class="fgrid" style="align-items:end">
        ${field('Date', inp('date', todayISO(), 'type="date"'))}
        ${field('Instrument', inp('instrument', run.market || '', 'list="instrList2"'))}
        ${field('Direction', sel('direction', 'Long', ['Long', 'Short']))}
        ${field('Result R', inp('rManual', '', 'type="number" step="any" inputmode="decimal" placeholder="e.g. 2 or -1"'))}
        ${field('Note', inp('notes', '', 'placeholder="optional"'))}
        <button type="submit" class="btn primary">${icon('plus')} Add</button>
      </form>
      <datalist id="instrList2">${[...new Set(st.trades.map(x => x.instrument).filter(Boolean))].map(i => `<option value="${esc(i)}">`).join('')}</datalist>
    </div>

    <div class="card" style="margin-top:14px;padding:6px 10px">
      ${list.length ? `<div class="scroll-x"><table class="tbl">
        <thead><tr><th>Date</th><th>Instrument</th><th class="opt">Dir</th><th class="num">R</th><th class="opt">Note</th></tr></thead>
        <tbody>${list.map(t => { const r = tradeR(t); return `<tr data-act="trade.open" data-id="${t.id}">
          <td class="mono tiny">${fmtDate(t.date)}</td><td><strong>${esc(t.instrument || '—')}</strong></td>
          <td class="opt tiny ${t.direction === 'Short' ? 'down' : 'up'}">${esc(t.direction || '')}</td>
          <td class="num ${r == null ? 'faint' : r >= 0 ? 'up' : 'down'}">${fmtR(r)}</td>
          <td class="opt tiny muted">${esc((t.notes || '').slice(0, 60))}</td></tr>`; }).join('')}</tbody></table></div>`
        : emptyState('No sample yet', 'Use fast entry above. One row per trade the rules would have taken.', null)}
    </div>

    ${run.notes ? `<div class="card" style="margin-top:14px"><div class="card-h"><span class="eyebrow">Test notes</span></div>
      <p class="small muted" style="margin:0;white-space:pre-wrap">${esc(run.notes)}</p></div>` : ''}`,
    after() {
      $('#quickForm')?.addEventListener('submit', e => {
        e.preventDefault();
        const v = formData(e.target);
        if (num(v.rManual) === null) return toast('Enter the result in R.');
        S.st.trades.push({
          id: uid(), mode: 'backtest', runId: run.id, date: v.date, time: '', session: '',
          instrument: v.instrument, direction: v.direction, strategyId: run.strategyId,
          timeframe: run.timeframe || '', entry: '', stop: '', target: '', exit: '',
          rManual: v.rManual, status: 'Closed', notes: v.notes, tags: [], mistakes: [],
          rulesChecked: [], rulesFollowed: [], rulesTotal: 0
        });
        markDirty(); render();
      });
    }
  };
}

/* ---------- RULEBOOK ---------- */
VIEWS.rules = () => {
  const st = S.st, set = st.settings;
  const cats = [...new Set(st.rules.map(r => r.category))];

  // which rules actually cost money when broken
  const perf = st.rules.map(r => {
    const seen = st.trades.filter(t => (t.rulesChecked || []).includes(r.id) && t.status === 'Closed');
    const broke = seen.filter(t => !(t.rulesFollowed || []).includes(r.id));
    const kept = seen.filter(t => (t.rulesFollowed || []).includes(r.id));
    const avg = a => a.length ? a.reduce((x, t) => x + (tradeR(t) || 0), 0) / a.length : null;
    return { r, seen: seen.length, broke: broke.length, avgBroke: avg(broke), avgKept: avg(kept), cost: broke.length * ((avg(kept) || 0) - (avg(broke) || 0)) };
  }).filter(x => x.broke > 0).sort((a, b) => b.cost - a.cost);

  const all = stats(st.trades.filter(t => (t.mode || 'live') === 'live'), set);

  return {
    title: 'Rulebook',
    actions: `<button class="btn primary" data-act="rule.new">${icon('plus')} Add rule</button>`,
    html: `
    <div class="grid g3" style="margin-bottom:14px">
      <div class="tile"><span class="k">Adherence</span><span class="v ${all.adherence != null && all.adherence < 90 ? 'down' : 'up'}">${fmtPct(all.adherence)}</span><span class="s">across every logged trade</span></div>
      <div class="tile"><span class="k">Active rules</span><span class="v">${st.rules.filter(r => r.active).length}</span><span class="s">${st.rules.filter(r => r.active && r.mandatory).length} checked on every trade</span></div>
      <div class="tile"><span class="k">Rules broken</span><span class="v ${perf.length ? 'down' : ''}">${perf.reduce((a, x) => a + x.broke, 0)}</span><span class="s">times, on record</span></div>
    </div>

    ${perf.length ? `<div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="eyebrow">What breaking rules costs you</span></div>
      <div class="scroll-x"><table class="tbl">
        <thead><tr><th>Rule</th><th class="num">Broken</th><th class="num">Avg R kept</th><th class="num">Avg R broken</th></tr></thead>
        <tbody>${perf.slice(0, 8).map(x => `<tr data-act="rule.edit" data-id="${x.r.id}">
          <td class="small">${esc(x.r.text)}</td>
          <td class="num">${x.broke}/${x.seen}</td>
          <td class="num ${(x.avgKept || 0) >= 0 ? 'up' : 'down'}">${x.avgKept != null ? fmtR(x.avgKept) : '—'}</td>
          <td class="num ${(x.avgBroke || 0) >= 0 ? 'up' : 'down'}">${x.avgBroke != null ? fmtR(x.avgBroke) : '—'}</td></tr>`).join('')}</tbody></table></div>
      <p class="tiny faint" style="margin:10px 0 0">Once you have a real sample, this table usually makes the argument for discipline better than any amount of willpower.</p>
    </div>` : ''}

    ${cats.map(c => `<div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="eyebrow">${esc(c)}</span></div>
      ${st.rules.filter(r => r.category === c).map(r => `<div class="item">
        <button class="done-dot ${r.active ? 'on' : ''}" data-act="rule.toggle" data-id="${r.id}" aria-label="Toggle active"></button>
        <div class="grow"><div class="small" style="${r.active ? '' : 'opacity:.5;text-decoration:line-through'}">${esc(r.text)}</div>

        <button class="btn sm ghost" data-act="rule.edit" data-id="${r.id}">${icon('edit')}</button>

function ytId(url) {
  if (!url) return '';
  const m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(url.trim()) ? url.trim() : '');
}
async function ytTitle(url) {
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url));
    if (!r.ok) return '';
    return (await r.json()).title || '';
  } catch { return ''; }
}

VIEWS.glossary = () => {
  const tab = S.params.tab || 'terms';
  if (tab === 'types') return glossaryTypes();

  const st = S.st;
  const q = (S.params.q || '').toLowerCase();
  const cat = S.params.cat || '';
  const all = [...TERMS.map(([t, c, d]) => ({ t, c, d, own: false })),
               ...st.terms.map(x => ({ t: x.term, c: x.category || 'My notes', d: x.def, own: true, id: x.id }))];
  const cats = [...new Set(all.map(x => x.c))].sort();
  let list = all;
  if (cat) list = list.filter(x => x.c === cat);
  if (q) list = list.filter(x => (x.t + ' ' + x.d).toLowerCase().includes(q));
  list.sort((a, b) => a.t.localeCompare(b.t));

  return {
    title: 'Glossary',

    html: `
    ${glossTabs(tab)}

      <div class="row" style="margin-top:10px">
        <button class="chip ${!cat ? 'on' : ''}" data-act="gloss.cat" data-v="">Everything</button>

      </div>
    </div>
    <div class="card">
      ${list.length ? list.map(x => `<details class="term">
        <summary><strong style="font-size:14.5px">${esc(x.t)}</strong>
          <span class="chip tiny">${esc(x.c)}</span></summary>
        <div class="body"><p>${esc(x.d)}</p>

        const v = formData(sf), a = num(v.acct), p = num(v.pct), e = num(v.e), s = num(v.s), vpp = num(v.vpp) || 1;

        $('#szRisk').textContent = risk == null ? '—' : fmtMoney(risk, set.currency);
        $('#szDist').textContent = dist == null ? '—' : dist.toPrecision(6).replace(/\.?0+$/, '');

      };
      const calcRR = () => {
        const v = formData(rf), e = num(v.e), s = num(v.s), t = num(v.t);
        const risk = e != null && s != null ? Math.abs(e - s) : null;

        $('#rrBE').textContent = rr ? (100 / (1 + rr)).toFixed(1) + '%' : '—';
      };
      sf.addEventListener('input', calcSize); rf.addEventListener('input', calcRR);
      calcSize(); calcRR();
    }
  };
};

/* ============================================================
   SYNC
   ============================================================ */
async function syncPush(silent) {
  const sy = S.st.settings.sync;
  if (!sy.pat) { if (!silent) toast('Add a GitHub token in settings first.'); return; }
  S.syncing = true; updateSyncBadge();
  try {
    const blob = await seal(S.key, S.st);
    const payload = JSON.stringify({ v: 1, app: 'bench', salt: S.profile.salt, iter: S.profile.iter, updatedAt: S.st.updatedAt, blob }, null, 0);
    const fname = Gist.file(S.profile.id);
    if (!sy.gistId) sy.gistId = await Gist.create(sy.pat, fname, payload);
    else await Gist.push(sy.pat, sy.gistId, fname, payload);
    sy.lastPush = new Date().toISOString();
    await persist();
    if (!silent) toast('Pushed to GitHub.');
  } catch (e) { toast(e.message); }
  S.syncing = false; updateSyncBadge();
}
async function syncPull(silent) {
  const sy = S.st.settings.sync;
  if (!sy.pat || !sy.gistId) { if (!silent) toast('Add a token and gist ID first.'); return; }
  S.syncing = true; updateSyncBadge();
  try {
    const raw = await Gist.pull(sy.pat, sy.gistId, Gist.file(S.profile.id));
    const pkg = JSON.parse(raw);
    if (silent && pkg.updatedAt && pkg.updatedAt <= S.st.updatedAt) { S.syncing = false; updateSyncBadge(); return; }
    const remote = migrate(await open_(S.key, pkg.blob));
    if (!silent) {
      const ok = await confirmDialog('Replace local copy?',
        `The gist was last saved ${new Date(pkg.updatedAt).toLocaleString('en-GB')} and holds ${remote.trades.length} trades. This device holds ${S.st.trades.length}. Pulling overwrites what is here.`,
        'Pull and replace');
      if (!ok) { S.syncing = false; updateSyncBadge(); return; }
    }
    remote.settings.sync = sy;
    remote.settings.sync.lastPull = new Date().toISOString();
    S.st = remote; await persist();
    S.syncing = false; render();
    toast('Pulled ' + remote.trades.length + ' trades.');
    return;
  } catch (e) { if (!silent) toast(e.message.includes('decrypt') ? 'That gist was encrypted with a different passphrase.' : e.message); }
  S.syncing = false; updateSyncBadge();
}

    body: `<form id="vidForm" class="stack" style="gap:14px">
      ${field('YouTube link', inp('url', d.url, 'placeholder="https://youtube.com/watch?v=… " autofocus'))}
      ${field('Title', inp('title', d.title, 'placeholder="Leave blank to fetch it from YouTube"'))}
      ${field('Takeaway — what I will actually do differently', area('notes', d.notes, 'One or two lines beats a transcript.'))}
    </form>`,
    footer: `${v ? `<button class="btn danger" data-act="vid.del" data-pl="${plId}" data-id="${d.id}">Remove</button>` : ''}
      <div class="spacer"></div><button class="btn ghost" data-act="modal.close">Cancel</button>
      <button class="btn primary" data-act="vid.save" data-pl="${plId}" data-id="${d.id}" data-new="${v ? 0 : 1}">Save</button>`
  });
}
function termSheet(id) {
  const t = id ? S.st.terms.find(x => x.id === id) : null;
  const d = t || { id: uid(), term: '', category: 'My notes', def: '' };
  modal({
    title: t ? 'Edit term' : 'Add term',
    body: `<form id="termForm" class="stack" style="gap:14px">
      ${field('Term', inp('term', d.term, 'autofocus'))}
      ${field('Category', inp('category', d.category))}
      ${field('In your own words', area('def', d.def, 'If you cannot explain it plainly, you do not know it yet.'))}
    </form>`,
    footer: `${t ? `<button class="btn danger" data-act="term.del" data-id="${d.id}">Delete</button>` : ''}
      <div class="spacer"></div><button class="btn ghost" data-act="modal.close">Cancel</button>
      <button class="btn primary" data-act="term.save" data-id="${d.id}" data-new="${t ? 0 : 1}">Save</button>`
  });
}
function platSheet(id) {
  const p = id ? S.st.platforms.find(x => x.id === id) : null;
  const d = p || { id: uid(), name: '', url: '', note: '', colour: '#E8A33D' };
  modal({
    title: p ? 'Edit link' : 'Add link',
    body: `<form id="platForm" class="stack" style="gap:14px">
      ${field('Name', inp('name', d.name, 'placeholder="TradingView" autofocus'))}
      ${field('URL', inp('url', d.url, 'placeholder="https://…" type="url"'))}
      ${field('Short label', inp('note', d.note, 'placeholder="Charting and alerts"'))}
      ${field('Colour', inp('colour', d.colour, 'type="color" style="height:44px;padding:4px"'))}
    </form>`,
    footer: `${p ? `<button class="btn danger" data-act="plat.del" data-id="${d.id}">Delete</button>` : ''}
      <div class="spacer"></div><button class="btn ghost" data-act="modal.close">Cancel</button>
      <button class="btn primary" data-act="plat.save" data-id="${d.id}" data-new="${p ? 0 : 1}">Save</button>`
  });
}

/* ============================================================
   WIRING + BOOT
   ============================================================ */
document.addEventListener('submit', e => { e.preventDefault(); }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !document.body.contains(b)) return;
  const fn = A[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('beforeunload', e => { if (S.dirty) { persist(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && S.dirty) persist();
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

applyTheme(LS.getItem(K.theme) || 'dark');
const lastId = LS.getItem(K.last);
if (lastId && Profiles.find(lastId)) renderLock('unlock', { id: lastId });
else renderLock('pick');

</script>
</body>
