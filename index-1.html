/* ---------- RULEBOOK ---------- */
VIEWS.rules = () => {
  const st = S.st, set = st.settings;
  const cats = [...new Set(st.rules.map(r => r.category))];

  // which rules actually cost money when broken
  const perf = st.rules.map(r => {
    const seen = st.trades.filter(t => (t.rulesChecked || []).includes(r.id) && t.status === 'Closed');
    const broke = seen.filter(t => !(t.rulesFollowed || []).includes(r.id));
    const kept = seen.filter(t => (t.rulesFollowed || []).includes(r.id));
    const avg = a => a.length ? a.reduce((x, t) => x + (tradeR(t) || 0), 0) / a.length : null;
    return { r, seen: seen.length, broke: broke.length, avgBroke: avg(broke), avgKept: avg(kept), cost: broke.length * ((avg(kept) || 0) - (avg(broke) || 0)) };
  }).filter(x => x.broke > 0).sort((a, b) => b.cost - a.cost);

  const all = stats(st.trades.filter(t => (t.mode || 'live') === 'live'), set);

  return {
    title: 'Rulebook',
    actions: `<button class="btn primary" data-act="rule.new">${icon('plus')} Add rule</button>`,
    html: `
    <div class="grid g3" style="margin-bottom:14px">
      <div class="tile"><span class="k">Adherence</span><span class="v ${all.adherence != null && all.adherence < 90 ? 'down' : 'up'}">${fmtPct(all.adherence)}</span><span class="s">across every logged trade</span></div>
      <div class="tile"><span class="k">Active rules</span><span class="v">${st.rules.filter(r => r.active).length}</span><span class="s">${st.rules.filter(r => r.active && r.mandatory).length} checked on every trade</span></div>
      <div class="tile"><span class="k">Rules broken</span><span class="v ${perf.length ? 'down' : ''}">${perf.reduce((a, x) => a + x.broke, 0)}</span><span class="s">times, on record</span></div>
    </div>

    ${perf.length ? `<div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="eyebrow">What breaking rules costs you</span></div>
      <div class="scroll-x"><table class="tbl">
        <thead><tr><th>Rule</th><th class="num">Broken</th><th class="num">Avg R kept</th><th class="num">Avg R broken</th></tr></thead>
        <tbody>${perf.slice(0, 8).map(x => `<tr data-act="rule.edit" data-id="${x.r.id}">
          <td class="small">${esc(x.r.text)}</td>
          <td class="num">${x.broke}/${x.seen}</td>
          <td class="num ${(x.avgKept || 0) >= 0 ? 'up' : 'down'}">${x.avgKept != null ? fmtR(x.avgKept) : '—'}</td>
          <td class="num ${(x.avgBroke || 0) >= 0 ? 'up' : 'down'}">${x.avgBroke != null ? fmtR(x.avgBroke) : '—'}</td></tr>`).join('')}</tbody></table></div>
      <p class="tiny faint" style="margin:10px 0 0">Once you have a real sample, this table usually makes the argument for discipline better than any amount of willpower.</p>
    </div>` : ''}

    ${cats.map(c => `<div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="eyebrow">${esc(c)}</span></div>
      ${st.rules.filter(r => r.category === c).map(r => `<div class="item">
        <button class="done-dot ${r.active ? 'on' : ''}" data-act="rule.toggle" data-id="${r.id}" aria-label="Toggle active"></button>
        <div class="grow"><div class="small" style="${r.active ? '' : 'opacity:.5;text-decoration:line-through'}">${esc(r.text)}</div>
          ${r.mandatory ? '<span class="chip on tiny" style="margin-top:5px">Checked on every trade</span>' : ''}</div>
        <button class="btn sm ghost" data-act="rule.edit" data-id="${r.id}">${icon('edit')}</button>
      </div>`).join('')}
    </div>`).join('')}`
  };
};

function ytId(url) {
  if (!url) return '';
  const m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(url.trim()) ? url.trim() : '');
}
async function ytTitle(url) {
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url));
    if (!r.ok) return '';
    return (await r.json()).title || '';
  } catch { return ''; }
}

VIEWS.glossary = () => {
  const tab = S.params.tab || 'terms';
  if (tab === 'types') return glossaryTypes();

  const st = S.st;
  const q = (S.params.q || '').toLowerCase();
  const cat = S.params.cat || '';
  const all = [...TERMS.map(([t, c, d]) => ({ t, c, d, own: false })),
               ...st.terms.map(x => ({ t: x.term, c: x.category || 'My notes', d: x.def, own: true, id: x.id }))];
  const cats = [...new Set(all.map(x => x.c))].sort();
  let list = all;
  if (cat) list = list.filter(x => x.c === cat);
  if (q) list = list.filter(x => (x.t + ' ' + x.d).toLowerCase().includes(q));
  list.sort((a, b) => a.t.localeCompare(b.t));

  return {
    title: 'Glossary',
    actions: `<button class="btn primary" data-act="term.new">${icon('plus')} Add term</button>`,
    html: `
    ${glossTabs(tab)}

      <div class="row" style="margin-top:10px">
        <button class="chip ${!cat ? 'on' : ''}" data-act="gloss.cat" data-v="">Everything</button>

    </div>
    <div class="card">
      ${list.length ? list.map(x => `<details class="term">
        <summary><strong style="font-size:14.5px">${esc(x.t)}</strong>
          <span class="chip tiny">${esc(x.c)}</span></summary>
        <div class="body"><p>${esc(x.d)}</p>

/* ============================================================
   SYNC
   ============================================================ */
async function syncPush(silent) {
  const sy = S.st.settings.sync;
  if (!sy.pat) { if (!silent) toast('Add a GitHub token in settings first.'); return; }
  S.syncing = true; updateSyncBadge();
  try {
    const blob = await seal(S.key, S.st);
    const payload = JSON.stringify({ v: 1, app: 'bench', salt: S.profile.salt, iter: S.profile.iter, updatedAt: S.st.updatedAt, blob }, null, 0);
    const fname = Gist.file(S.profile.id);
    if (!sy.gistId) sy.gistId = await Gist.create(sy.pat, fname, payload);
    else await Gist.push(sy.pat, sy.gistId, fname, payload);
    sy.lastPush = new Date().toISOString();
    await persist();
    if (!silent) toast('Pushed to GitHub.');
  } catch (e) { toast(e.message); }
  S.syncing = false; updateSyncBadge();
}
async function syncPull(silent) {
  const sy = S.st.settings.sync;
  if (!sy.pat || !sy.gistId) { if (!silent) toast('Add a token and gist ID first.'); return; }
  S.syncing = true; updateSyncBadge();
  try {
    const raw = await Gist.pull(sy.pat, sy.gistId, Gist.file(S.profile.id));
    const pkg = JSON.parse(raw);
    if (silent && pkg.updatedAt && pkg.updatedAt <= S.st.updatedAt) { S.syncing = false; updateSyncBadge(); return; }
    const remote = migrate(await open_(S.key, pkg.blob));
    if (!silent) {
      const ok = await confirmDialog('Replace local copy?',
        `The gist was last saved ${new Date(pkg.updatedAt).toLocaleString('en-GB')} and holds ${remote.trades.length} trades. This device holds ${S.st.trades.length}. Pulling overwrites what is here.`,
        'Pull and replace');
      if (!ok) { S.syncing = false; updateSyncBadge(); return; }
    }
    remote.settings.sync = sy;
    remote.settings.sync.lastPull = new Date().toISOString();
    S.st = remote; await persist();
    S.syncing = false; render();
    toast('Pulled ' + remote.trades.length + ' trades.');
    return;
  } catch (e) { if (!silent) toast(e.message.includes('decrypt') ? 'That gist was encrypted with a different passphrase.' : e.message); }
  S.syncing = false; updateSyncBadge();
}

/* ============================================================
   BACKTEST ENGINE
   Deterministic, bar-by-bar, no look-ahead: a signal is read on a
   closed bar and filled at the next bar's open.
   ============================================================ */

/* ---------- CSV → bars ---------- */
function parseBars(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 3) throw new Error('That file has almost no rows in it.');
  const delim = [',', ';', '\t'].map(d => ({ d, n: (lines[0].match(new RegExp('\\' + d, 'g')) || []).length }))
    .sort((a, b) => b.n - a.n)[0].d;
  const split = l => l.split(delim).map(c => c.trim().replace(/^"|"$/g, ''));
  const head = split(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
  const find = (...names) => { for (const n of names) { const i = head.indexOf(n); if (i > -1) return i; } return -1; };
  const iT = find('time', 'date', 'datetime', 'timestamp', 'localtime');
  const iO = find('open', 'o'), iH = find('high', 'h'), iL = find('low', 'l');
  const iC = find('close', 'c', 'price', 'last', 'adjclose');
  const iV = find('volume', 'vol', 'v');
  if (iO < 0 || iH < 0 || iL < 0 || iC < 0)
    throw new Error('Needs columns for open, high, low and close. Found: ' + head.filter(Boolean).join(', '));

  const bars = [];
  for (let r = 1; r < lines.length; r++) {
    const c = split(lines[r]);
    const o = parseFloat(c[iO]), h = parseFloat(c[iH]), l = parseFloat(c[iL]), cl = parseFloat(c[iC]);
    if (![o, h, l, cl].every(isFinite)) continue;
    let t;
    const raw = iT > -1 ? c[iT] : '';
    const asNum = Number(raw);
    if (raw && isFinite(asNum) && asNum > 1e8) t = asNum > 1e11 ? asNum : asNum * 1000;
    else if (raw) t = Date.parse(raw.replace(' ', 'T')) || Date.parse(raw);
    if (!isFinite(t)) t = r * 60000;
    const d = new Date(t);
    bars.push({
      t, o, h, l, c: cl, v: iV > -1 ? (parseFloat(c[iV]) || 0) : 0,
      d: d.toLocaleDateString('en-CA'), hm: d.toTimeString().slice(0, 5), dow: d.getDay()
    });
  }
  if (bars.length < 30) throw new Error('Only ' + bars.length + ' usable rows. Need a lot more than that.');
  bars.sort((a, b) => a.t - b.t);
  return bars;
}

/* ---------- indicators ---------- */
const SMA = (a, p) => a.map((_, i) => i < p - 1 ? null : a.slice(i - p + 1, i + 1).reduce((x, y) => x + y, 0) / p);
function EMA(a, p) {
  const k = 2 / (p + 1), out = []; let e = null;
  a.forEach((v, i) => { e = i === 0 ? v : v * k + e * (1 - k); out.push(i < p - 1 ? null : e); });
  return out;
}
function RSI(c, p) {
  const out = new Array(c.length).fill(null); let ag = 0, al = 0;
  for (let i = 1; i < c.length; i++) {
    const ch = c[i] - c[i - 1], g = Math.max(0, ch), l = Math.max(0, -ch);
    if (i <= p) { ag += g / p; al += l / p; if (i === p) out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); }
    else { ag = (ag * (p - 1) + g) / p; al = (al * (p - 1) + l) / p; out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); }
  }
  return out;
}
function ATR(bars, p) {
  const out = new Array(bars.length).fill(null); let a = null;
  for (let i = 1; i < bars.length; i++) {
    const b = bars[i], pc = bars[i - 1].c;
    const tr = Math.max(b.h - b.l, Math.abs(b.h - pc), Math.abs(b.l - pc));
    a = i <= p ? (a === null ? tr : (a * (i - 1) + tr) / i) : (a * (p - 1) + tr) / p;
    if (i >= p) out[i] = a;
  }
  return out;
}
/** Extreme of the p bars BEFORE the current one, so a breakout test is meaningful. */
function EXTREME(a, p, hi) {
  return a.map((_, i) => {
    if (i < p) return null;
    const w = a.slice(i - p, i);
    return hi ? Math.max(...w) : Math.min(...w);
  });
}
function STDEV(a, p) {
  return a.map((_, i) => {
    if (i < p - 1) return null;
    const w = a.slice(i - p + 1, i + 1), m = w.reduce((x, y) => x + y, 0) / p;
    return Math.sqrt(w.reduce((x, y) => x + (y - m) ** 2, 0) / p);
  });
}
function computeInds(bars, defs) {
  const out = {};
  const pick = n => {
    switch ((n || 'close').toLowerCase()) {
      case 'open': return bars.map(b => b.o);
      case 'high': return bars.map(b => b.h);
      case 'low': return bars.map(b => b.l);
      case 'volume': return bars.map(b => b.v);
      case 'hl2': return bars.map(b => (b.h + b.l) / 2);
      default: return bars.map(b => b.c);
    }
  };
  for (const d of defs || []) {
    const p = Math.max(1, Math.round(+d.period || 14)), a = pick(d.source);
    switch (String(d.type || '').toLowerCase()) {
      case 'sma': out[d.id] = SMA(a, p); break;
      case 'ema': out[d.id] = EMA(a, p); break;
      case 'rsi': out[d.id] = RSI(bars.map(b => b.c), p); break;
      case 'atr': out[d.id] = ATR(bars, p); break;
      case 'highest': out[d.id] = EXTREME(bars.map(b => b.h), p, true); break;
      case 'lowest': out[d.id] = EXTREME(bars.map(b => b.l), p, false); break;
      case 'stdev': out[d.id] = STDEV(a, p); break;
      default: out[d.id] = a;
    }
  }
  return out;
}

/* ---------- condition evaluation ---------- */
function operand(x, bars, ind, i) {
  if (x == null) return null;
  if (typeof x === 'number') return x;
  const s = String(x).trim();
  if (/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  switch (s.toLowerCase()) {
    case 'open': return bars[i].o; case 'high': return bars[i].h;
    case 'low': return bars[i].l; case 'close': return bars[i].c; case 'volume': return bars[i].v;
  }
  const arr = ind[s];
  return arr ? (arr[i] ?? null) : null;
}
function condTrue(c, bars, ind, i) {
  const op = String(c.op || 'gt');
  const L = operand(c.left, bars, ind, i), R = operand(c.right, bars, ind, i);
  if (L == null || R == null || !isFinite(L) || !isFinite(R)) return false;
  if (op === 'crossAbove' || op === 'crossBelow') {
    if (i < 1) return false;
    const pL = operand(c.left, bars, ind, i - 1), pR = operand(c.right, bars, ind, i - 1);
    if (pL == null || pR == null) return false;
    return op === 'crossAbove' ? (pL <= pR && L > R) : (pL >= pR && L < R);
  }
  switch (op) {
    case 'gt': return L > R; case 'lt': return L < R;
    case 'gte': return L >= R; case 'lte': return L <= R;
    case 'eq': return Math.abs(L - R) < 1e-12;
  }
  return false;
}
function filtersPass(fs, bar) {
  for (const f of fs || []) {
    if (f.type === 'session') { if (!(bar.hm >= (f.from || '00:00') && bar.hm <= (f.to || '23:59'))) return false; }
    else if (f.type === 'weekday') { if (!(f.days || []).map(Number).includes(bar.dow)) return false; }
  }
  return true;
}

/* ---------- the run ---------- */
function runBacktest(bars, cfg, symbol) {
  const warn = [];
  const ind = computeInds(bars, cfg.indicators);
  const atrFor = p => ATR(bars, Math.max(1, Math.round(p || 14)));
  const stopCfg = cfg.stop || { type: 'percent', value: 1 };
  const tgtCfg = cfg.target || { type: 'r', value: 2 };
  const trailCfg = cfg.trail || { type: 'none' };
  const costs = cfg.costs || {};
  const spread = +costs.spreadPoints || 0, commPct = +costs.commissionPct || 0;
  const atrStop = atrFor(stopCfg.period), atrTgt = atrFor(tgtCfg.period), atrTrail = atrFor(trailCfg.period);
  const lowN = EXTREME(bars.map(b => b.l), Math.max(1, Math.round(stopCfg.period || 10)), false);
  const highN = EXTREME(bars.map(b => b.h), Math.max(1, Math.round(stopCfg.period || 10)), true);

  const periods = (cfg.indicators || []).map(d => +d.period || 14);
  const warm = Math.max(3, ...periods, Math.round(stopCfg.period || 14)) + 2;
  if (warm >= bars.length - 5) throw new Error('Not enough bars for those indicator periods.');

  const dir = String(cfg.direction || 'both').toLowerCase();
  const wantLong = dir === 'long' || dir === 'both';
  const wantShort = dir === 'short' || dir === 'both';
  const cl = cfg.entryLong || [], cs = cfg.entryShort || [];
  if (wantLong && !cl.length && wantShort && !cs.length) throw new Error('No entry conditions in the config.');

  const out = [];
  let pos = null, pending = null;

  const stopDist = (i, px, isLong) => {
    const t = String(stopCfg.type || 'percent').toLowerCase(), v = +stopCfg.value || 1;
    if (t === 'atr') return (atrStop[i] || 0) * v;
    if (t === 'percent') return px * v / 100;
    if (t === 'points') return v;
    if (t === 'swing') return Math.abs(px - (isLong ? (lowN[i] ?? px) : (highN[i] ?? px))) || px * 0.005;
    return px * v / 100;
  };

  for (let i = warm; i < bars.length; i++) {
    const b = bars[i];

    if (!pos && pending) {
      const isLong = pending.dir === 'Long';
      const fill = b.o + (isLong ? spread / 2 : -spread / 2);
      const dist = stopDist(pending.i, fill, isLong);
      if (!isFinite(dist) || dist <= 0) { pending = null; continue; }
      const stop = isLong ? fill - dist : fill + dist;
      let target = null;
      const tt = String(tgtCfg.type || 'r').toLowerCase(), tv = +tgtCfg.value || 2;
      if (tt === 'r') target = isLong ? fill + dist * tv : fill - dist * tv;
      else if (tt === 'atr') target = isLong ? fill + (atrTgt[pending.i] || 0) * tv : fill - (atrTgt[pending.i] || 0) * tv;
      else if (tt === 'percent') target = isLong ? fill * (1 + tv / 100) : fill * (1 - tv / 100);
      pos = { dir: pending.dir, entry: fill, stop, target, dist, i, bar: b };
      pending = null;
    }

    if (pos) {
      const isLong = pos.dir === 'Long';
      let exit = null, why = '';
      // stop is checked first when both levels sit inside the same bar
      if (isLong ? b.l <= pos.stop : b.h >= pos.stop) { exit = pos.stop; why = 'stop'; }
      else if (pos.target != null && (isLong ? b.h >= pos.target : b.l <= pos.target)) { exit = pos.target; why = 'target'; }
      else if (cfg.timeStopBars && i - pos.i >= cfg.timeStopBars) { exit = b.c; why = 'time stop'; }
      else if (cfg.exitOnSessionClose && (i + 1 >= bars.length || bars[i + 1].d !== b.d)) { exit = b.c; why = 'session close'; }
      else if (i === bars.length - 1) { exit = b.c; why = 'end of data'; }

      if (exit !== null) {
        const fill = exit + (isLong ? -spread / 2 : spread / 2);
        const gross = isLong ? fill - pos.entry : pos.entry - fill;
        const comm = (pos.entry + fill) * commPct / 100;
        const r = (gross - comm) / pos.dist;
        out.push({
          date: pos.bar.d, time: pos.bar.hm, instrument: symbol, direction: pos.dir,
          entry: +pos.entry.toFixed(6), stop: +pos.stop.toFixed(6),
          target: pos.target != null ? +pos.target.toFixed(6) : '',
          exit: +fill.toFixed(6), rManual: +r.toFixed(4), status: 'Closed',
          notes: 'Exit: ' + why + ' · held ' + (i - pos.i) + ' bars'
        });
        pos = null;
        if (out.length > 5000) { warn.push('Stopped at 5,000 trades — the rules fire far too often to be realistic.'); break; }
        continue;
      }
      if (String(trailCfg.type).toLowerCase() === 'atr') {
        const t = (atrTrail[i] || 0) * (+trailCfg.value || 2);
        if (t > 0) pos.stop = isLong ? Math.max(pos.stop, b.c - t) : Math.min(pos.stop, b.c + t);
      }
    }

    if (!pos && !pending && i < bars.length - 1 && filtersPass(cfg.filters, b)) {
      if (wantLong && cl.length && cl.every(c => condTrue(c, bars, ind, i))) pending = { dir: 'Long', i };
      else if (wantShort && cs.length && cs.every(c => condTrue(c, bars, ind, i))) pending = { dir: 'Short', i };
    }
  }

  if (!out.length) warn.push('The rules never triggered. Loosen a condition, or check the indicator ids match what the conditions reference.');
  if (out.length && out.length < 30) warn.push('Only ' + out.length + ' trades. Nothing here is statistically meaningful yet.');
  if (!spread && !commPct) warn.push('No spread or commission modelled, so this result is better than anything you could actually trade.');
  return { trades: out, warnings: warn, bars: bars.length };
}

const SCHEMA_DOC = `A config is JSON with these fields:
{
  "direction": "long" | "short" | "both",
  "indicators": [ {"id":"ema20","type":"sma|ema|rsi|atr|highest|lowest|stdev","period":20,"source":"close|open|high|low|volume|hl2"} ],
  "entryLong":  [ {"left":"close","op":"crossAbove|crossBelow|gt|lt|gte|lte","right":"ema20"} ],
  "entryShort": [ ... same shape ... ],
  "filters":    [ {"type":"session","from":"08:00","to":"11:30"}, {"type":"weekday","days":[1,2,3,4,5]} ],
  "stop":   {"type":"atr|percent|points|swing","value":1.5,"period":14},
  "target": {"type":"r|atr|percent|none","value":2},
  "trail":  {"type":"none|atr","value":2,"period":14},
  "timeStopBars": 0,
  "exitOnSessionClose": false,
  "costs": {"spreadPoints":0,"commissionPct":0}
}
Rules of the engine you must design within:
- left and right are a number, a bar field (open/high/low/close/volume), or an indicator id you declared.
- "highest"/"lowest" return the extreme of the PREVIOUS n bars, excluding the current one, so breakouts are testable.
- Every condition in entryLong must be true on the same closed bar. Entry fills at the NEXT bar's open.
- If stop and target both sit inside one bar, the engine assumes the stop filled first.
- Only the fields above exist. Do not invent indicators, operators or filter types.`;

async function aiDraft(brief) {
  const ai = S.st.settings.ai;
  if (!ai.key) throw new Error('NOKEY');
  const system = `You are a quantitative trading engineer. Turn a trader's plain-English description into a precise, testable strategy.

${SCHEMA_DOC}

Reply with ONE JSON object and nothing else — no prose, no markdown fences:
{
 "name": short name,
 "family": one of: Trend following, Mean reversion, Breakout / range expansion, Opening range breakout (ORB), VWAP reversion and trend, Momentum / relative strength, Supply and demand / order block, ICT / smart money concepts, News and event driven, Gap trading, Scalping, Swing trading structure, Pairs / statistical arbitrage, Carry, Grid and martingale, Dollar cost averaging (DCA), Seasonality and time-of-day, Volatility contraction pattern, Custom,
 "markets": string,
 "timeframes": string,
 "thesis": 1-2 sentences on the inefficiency being harvested,
 "entry": plain-English entry rules,
 "exit": plain-English exit rules,
 "risk": position sizing and risk rules,
 "invalidation": what would make the trader retire this strategy,
 "config": the JSON config object above,
 "assumptions": [things you had to decide because the description left them open],
 "critique": honest paragraph on where this is likely to fail, cost sensitivity, and overfitting risk,
 "watchouts": [3-5 short specific warnings],
 "pine": a complete TradingView Pine Script v5 strategy() implementing the same rules
}

Be conservative and honest. If the description is vague, pick sensible defaults and list them under assumptions. Never claim an edge exists. Include realistic costs in the config rather than leaving them at zero.`;

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': ai.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model: ai.model || 'claude-sonnet-5', max_tokens: 8000, system, messages: [{ role: 'user', content: brief }] })
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    if (r.status === 401) throw new Error('The API key was rejected.');
    if (r.status === 429) throw new Error('Rate limited by the API. Wait a moment and try again.');
    if (r.status === 400 && t.includes('model')) throw new Error('That model name is not available on your account.');
    throw new Error('API returned ' + r.status + '. ' + t.slice(0, 160));
  }
  const d = await r.json();
  let text = (d.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
  text = text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  const first = text.indexOf('{'), last = text.lastIndexOf('}');
  if (first < 0) throw new Error('The model did not return a config.');
  return JSON.parse(text.slice(first, last + 1));
}

          e.preventDefault(); dz.classList.remove('over');
          const f = e.dataTransfer.files[0]; if (f) loadBars(f);
        });
      }
    }
  };
};

async function loadBars(file) {
  try {
    const bars = parseBars(await file.text());
    const gaps = [];
    for (let i = 1; i < Math.min(bars.length, 400); i++) gaps.push(bars[i].t - bars[i - 1].t);
    gaps.sort((a, b) => a - b);
    const med = gaps[Math.floor(gaps.length / 2)] || 0;
    const tf = med >= 864e5 ? Math.round(med / 864e5) + ' day' : med >= 36e5 ? Math.round(med / 36e5) + ' hour' : Math.round(med / 6e4) + ' min';
    LAB.bars = bars;
    LAB.meta = {
      bars: bars.length, from: bars[0].d, to: bars[bars.length - 1].d, tf,
      symbol: (LAB.meta?.symbol) || file.name.replace(/\.(csv|txt)$/i, '').split(/[,_]/)[0] || 'Backtest'
    };
    render(); toast(bars.length.toLocaleString() + ' bars loaded.');
  } catch (e) { LAB.err = e.message; render(); }
}

Object.assign(A, {
  async 'lab.draft'() {
    const brief = ($('#briefIn')?.value || '').trim();
    if (!brief) return toast('Describe the strategy first.');
    LAB.brief = brief; LAB.err = ''; LAB.busy = true; render();
    try {
      LAB.spec = await aiDraft(brief);
      LAB.result = null;
    } catch (e) {
      LAB.err = e.message === 'NOKEY' ? 'No API key set. Add one in settings.' : e.message;
    }
    LAB.busy = false; render();
  },
  'lab.manual'() {
    modal({
      title: 'Paste an engine config',
      body: `<p class="small muted" style="margin:0 0 12px">Any JSON matching the engine schema. Useful if you wrote one elsewhere, or want to rerun an old test with one number changed.</p>
        <textarea id="rawCfg" style="min-height:280px;font-family:var(--m);font-size:12.5px" placeholder='{"direction":"long","indicators":[...],"entryLong":[...]}'></textarea>
        <details class="term" style="margin-top:12px"><summary><strong>Schema</strong></summary><div class="body"><pre class="code">${esc(SCHEMA_DOC)}</pre></div></details>`,
      footer: `<div class="spacer"></div><button class="btn ghost" data-act="modal.close">Cancel</button>
               <button class="btn primary" data-act="lab.manualSave">Use this config</button>`
    });
  },
  'lab.manualSave'() {
    try {
      const cfg = JSON.parse($('#rawCfg').value);
      LAB.spec = { name: cfg.name || 'Pasted config', config: cfg };
      LAB.result = null; closeModal(); render();
    } catch { toast('That is not valid JSON.'); }
  },
  'lab.applyCfg'() {
    try { LAB.spec.config = JSON.parse($('#cfgIn').value); toast('Config updated.'); LAB.result = null; render(); }
    catch { toast('That is not valid JSON.'); }
  },
  async 'lab.copyPine'() {
    try { await navigator.clipboard.writeText(LAB.spec.pine); toast('Pine Script copied.'); }
    catch { toast('Copy failed — select the text manually.'); }
  },
  'lab.run'() {
    const sym = $('[name=labSym]')?.value.trim() || LAB.meta?.symbol || 'Backtest';
    LAB.meta.symbol = sym;
    try {
      LAB.result = runBacktest(LAB.bars, LAB.spec.config || {}, sym);
      LAB.err = '';
      toast(LAB.result.trades.length + ' trades generated.');
    } catch (e) { LAB.err = e.message; LAB.result = null; }
    render();
  },
  async 'lab.toPlaybook'() {
    const sp = LAB.spec;
    const id = uid();
    S.st.strategies.push({
      id, created: new Date().toISOString(), name: sp.name || 'AI draft',
      type: sp.family || '', markets: sp.markets || '', timeframes: sp.timeframes || '',
      status: 'Testing', thesis: sp.thesis || '', entry: sp.entry || '', exit: sp.exit || '',
      risk: sp.risk || '', invalidation: sp.invalidation || '',
      notes: [(sp.critique || ''), ...(sp.watchouts || []).map(w => '• ' + w)].filter(Boolean).join('\n')
    });
    LAB.spec.savedStrategyId = id;
    await commit(); toast('Saved to playbook.');
  },
  async 'lab.save'() {
    const sp = LAB.spec, res = LAB.result;
    let sid = sp.savedStrategyId;
    if (!sid) { await A['lab.toPlaybook'](); sid = LAB.spec.savedStrategyId; }
    const runId = uid();
    S.st.runs.push({
      id: runId, created: new Date().toISOString(),
      name: (sp.name || 'AI backtest') + ' · ' + LAB.meta.symbol,
      strategyId: sid, market: LAB.meta.symbol, timeframe: LAB.meta.tf,
      from: LAB.meta.from, to: LAB.meta.to, status: 'Complete',
      notes: 'Run by the Bench engine over ' + LAB.meta.bars.toLocaleString() + ' bars.\n\nConfig:\n' + JSON.stringify(sp.config, null, 2)
    });
    for (const t of res.trades) {
      S.st.trades.push({
        id: uid(), mode: 'backtest', runId, strategyId: sid, session: '', timeframe: LAB.meta.tf,
        tags: ['engine'], mistakes: [], rulesChecked: [], rulesFollowed: [], rulesTotal: 0, ...t
      });
    }
    await persist();
    S.route = 'bench'; S.params = { run: runId }; render();
    toast(res.trades.length + ' trades saved to the bench.');
  },
  'lab.reset'() { LAB.spec = null; LAB.result = null; LAB.err = ''; render(); }
});

/* ---------- start ---------- */
applyTheme(LS.getItem(K.theme) || 'dark');
const lastId = LS.getItem(K.last);
if (lastId && Profiles.find(lastId)) renderLock('unlock', { id: lastId });
else renderLock('pick');

</script>
