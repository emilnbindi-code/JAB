<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench — trading desk</title>
<meta name="description" content="Trade journal, AI backtest lab, rulebook and learning portal.">
<meta name="theme-color" content="#0A0C11">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BENCH — design tokens
   ============================================================ */
:root{
  --bg:#0A0C11; --surface:#12151C; --raised:#171B24; --hover:#1E2330; --sunk:#0D1015;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --txt:#EDEFF4; --dim:#98A0B0; --faint:#626B7C;
  --accent:#7B8CFF; --accent-2:#A57BFF; --accent-soft:rgba(123,140,255,.15);
  --up:#2DD4A0; --down:#FF6B7A; --warn:#FFB459;
  --up-soft:rgba(45,212,160,.13); --down-soft:rgba(255,107,122,.13); --warn-soft:rgba(255,180,89,.13);
  --f:'Onest',system-ui,-apple-system,sans-serif;
  --m:'JetBrains Mono',ui-monospace,monospace;
  --r:16px; --r-sm:11px; --r-xs:8px;
  --sh-1:0 1px 2px rgba(0,0,0,.24);
  --sh-2:0 4px 16px -4px rgba(0,0,0,.4);
  --sh-3:0 24px 48px -12px rgba(0,0,0,.55);
  --pad:clamp(16px,3.2vw,30px);
  --ease:cubic-bezier(.32,.72,0,1);
}
[data-theme="light"]{
  --bg:#F5F6FA; --surface:#FFFFFF; --raised:#FBFBFD; --hover:#F0F1F6; --sunk:#EDEEF4;
  --line:rgba(12,16,26,.08); --line-2:rgba(12,16,26,.16);
  --txt:#11141C; --dim:#5C6472; --faint:#8B93A2;
  --accent:#5566EE; --accent-2:#8855EE; --accent-soft:rgba(85,102,238,.10);
  --up:#0FA97C; --down:#DC3F52; --warn:#B67415;
  --up-soft:rgba(15,169,124,.10); --down-soft:rgba(220,63,82,.10); --warn-soft:rgba(182,116,21,.10);
  --sh-1:0 1px 2px rgba(12,16,26,.05);
  --sh-2:0 4px 14px -4px rgba(12,16,26,.10);
  --sh-3:0 24px 44px -14px rgba(12,16,26,.18);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;letter-spacing:-.006em;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em;line-height:1.25}
h1{font-size:clamp(20px,3.2vw,26px);font-weight:700}
h2{font-size:17px}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eyebrow{font-size:11.5px;font-weight:500;color:var(--faint)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  padding:16px 12px calc(16px + env(safe-area-inset-bottom));
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 4px 14px -3px var(--accent-soft);
}
.brand-mark::after{
  content:"";position:absolute;left:5px;right:5px;top:12px;height:2.5px;border-radius:2px;background:#fff;
  transform:rotate(-34deg);transform-origin:center;
}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.03em}
.navgroup{margin-bottom:16px}
.navgroup>.eyebrow{padding:0 10px 7px;display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.navlink{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:none;
  border-radius:var(--r-sm);color:var(--dim);cursor:pointer;text-align:left;font-size:14.5px;font-weight:500;
  transition:background .16s var(--ease),color .16s var(--ease);position:relative;
}
.navlink:hover{background:var(--hover);color:var(--txt)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--txt)}
.navlink[aria-current="page"] .ico{color:var(--accent)}
.navlink[aria-current="page"]::before{
  content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent);
}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.whoami{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);width:100%;
  border:0;background:none;cursor:pointer;color:var(--txt);transition:background .16s var(--ease)}
.whoami:hover{background:var(--hover)}
.avatar{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;font-size:12px;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) var(--pad) 11px;
  display:flex;align-items:center;gap:12px;min-height:60px;
}
.topbar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:var(--pad) var(--pad) 120px;max-width:1280px;width:100%;margin:0 auto;flex:1}

.tabbar{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .view{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  .tabbar{
    display:grid;grid-auto-flow:column;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--surface) 86%,transparent);
    backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;border:0;background:none;
    color:var(--faint);cursor:pointer;border-radius:var(--r-sm);font-size:10.5px;font-weight:600;transition:color .16s}
  .tab[aria-current="page"]{color:var(--accent)}
  .tab .ico{width:21px;height:21px}
  .topbar h1{font-size:19px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2,.card-h h3,.card-h .eyebrow{flex:1;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.small{font-size:13.5px} .tiny{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)} .acc{color:var(--accent)} .warn{color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:12px}
.divider{height:1px;background:var(--line);margin:16px 0}
.clickable{cursor:pointer;transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.clickable:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--sh-2)}
.clickable:active{transform:translateY(0)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 15px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--raised);
  color:var(--txt);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s,transform .1s var(--ease),opacity .16s;
}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent;
  color:#fff;font-weight:600;box-shadow:0 4px 14px -4px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--hover);color:var(--txt)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 35%,transparent);background:none}
.btn.danger:hover{background:var(--down-soft)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:var(--r-xs)}
.btn.icon{padding:0;width:38px;height:38px}
.btn.icon.sm{width:32px;height:32px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--raised);font-size:12px;color:var(--dim);font-weight:500}
button.chip{cursor:pointer;transition:background .16s,border-color .16s,color .16s}
button.chip:hover{background:var(--hover);color:var(--txt)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--accent)}
.chip.win{background:var(--up-soft);border-color:color-mix(in srgb,var(--up) 32%,transparent);color:var(--up)}
.chip.loss{background:var(--down-soft);border-color:color-mix(in srgb,var(--down) 32%,transparent);color:var(--down)}
.chip.wr{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--warn)}

label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f>span{font-size:12.5px;font-weight:500;color:var(--dim)}
input,select,textarea{
  width:100%;padding:10px 13px;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r-sm);font-size:14.5px;transition:border-color .16s,box-shadow .16s,background .16s;
}
[data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}
input[type=number],input[type=date],input[type=time]{font-family:var(--m);letter-spacing:-.02em}
textarea{resize:vertical;min-height:84px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.fgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--sunk);cursor:pointer;transition:background .16s,border-color .16s}
[data-theme="light"] .check{background:var(--surface)}
.check:hover{border-color:var(--line-2)}
.check input{width:18px;height:18px;flex:none;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
.check.on{border-color:color-mix(in srgb,var(--accent) 38%,transparent);background:var(--accent-soft)}
.check>span{font-size:13.5px;line-height:1.5}

/* ---------- hero chart ---------- */
.instr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-1)}
.instr-top{display:flex;align-items:center;gap:10px;padding:15px 18px 11px;flex-wrap:wrap}
.scope{position:relative;height:clamp(160px,27vw,230px);padding:0 2px}
.scope svg{display:block;width:100%;height:100%}
.trace{fill:none;stroke:url(#gline);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.trace-fill{stroke:none;fill:url(#gfill)}
.gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6;stroke-linecap:round}
@media(prefers-reduced-motion:no-preference){
  .trace.sweep{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:sweep 1.15s var(--ease) forwards}
  .trace-fill.sweep{opacity:0;animation:fadein .55s .5s ease forwards}
}
@keyframes sweep{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.readout{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.cell{padding:14px 16px;min-width:0;position:relative}
.cell+.cell::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.cell .k{font-size:11.5px;color:var(--faint);display:block;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v{font-family:var(--m);font-size:clamp(16px,2.3vw,20px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
@media(max-width:780px){
  .readout{grid-template-columns:repeat(3,1fr)}
  .cell:nth-child(4)::before{display:none}
  .cell:nth-child(-n+3){border-bottom:1px solid var(--line)}
}

/* ---------- tiles ---------- */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh-1)}
.tile .k{font-size:12px;color:var(--faint);display:block;margin-bottom:5px}
.tile .v{font-family:var(--m);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em;display:block}
.tile .s{font-size:12px;color:var(--dim);margin-top:3px;display:block}

/* ---------- progress ---------- */
.bar{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .5s var(--ease)}
.bar.g>i{background:linear-gradient(90deg,var(--up),color-mix(in srgb,var(--up) 55%,var(--accent)))}
.wrbar{height:7px;border-radius:99px;overflow:hidden;display:flex;background:var(--sunk)}
.wrbar>i{display:block;height:100%}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;font-weight:500;color:var(--faint);text-align:left;padding:9px 11px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]:not([data-act=noop]){cursor:pointer;transition:background .14s}
.tbl tbody tr[data-act]:not([data-act=noop]):hover{background:var(--hover)}
.tbl td.num,.tbl th.num{font-variant-numeric:tabular-nums;text-align:right}
.tbl td.num{font-family:var(--m);letter-spacing:-.03em}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:640px){.tbl .opt{display:none}.tbl th,.tbl td{padding:10px 7px}}

.item{display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.pill{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-family:var(--m);font-size:12px;font-weight:600}
.pill.long{background:var(--up-soft);color:var(--up)}
.pill.short{background:var(--down-soft);color:var(--down)}
.pill.bt{background:var(--accent-soft);color:var(--accent)}

.empty{text-align:center;padding:44px 20px;color:var(--dim)}
.empty .eyebrow{display:block;margin-bottom:8px;font-size:15px;color:var(--txt);font-weight:600}
.empty p{margin:6px 0 16px;font-size:14px;max-width:44ch;margin-inline:auto;line-height:1.6}

/* ---------- lock ---------- */
.lock{min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.lock::before{content:"";position:absolute;top:-32%;left:50%;transform:translateX(-50%);
  width:min(760px,140vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--accent-soft),transparent 62%);pointer-events:none}
.lockbox{width:100%;max-width:392px;position:relative}
.lockbox .brand{justify-content:center;padding-bottom:4px}
.lock-sub{text-align:center;color:var(--dim);font-size:14px;margin:0 0 24px;line-height:1.6}
.prof{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;
  text-align:left;color:var(--txt);transition:border-color .16s,transform .16s var(--ease)}
.prof:hover{border-color:var(--line-2);transform:translateY(-1px)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,7,11,.6);backdrop-filter:blur(6px);
  display:grid;place-items:end center;animation:scrimIn .2s ease}
@keyframes scrimIn{from{opacity:0}}
@media(min-width:720px){.scrim{place-items:center;padding:24px}}
.sheet{background:var(--surface);border:1px solid var(--line);width:100%;max-width:640px;
  border-radius:22px 22px 0 0;max-height:93dvh;display:flex;flex-direction:column;box-shadow:var(--sh-3);
  animation:rise .3s var(--ease)}
@media(min-width:720px){.sheet{border-radius:var(--r);max-height:88dvh;animation:pop .2s var(--ease)}}
@keyframes rise{from{transform:translateY(40px)}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1}
.sheet-b{padding:18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.grabber{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:8px auto -6px}
@media(min-width:720px){.grabber{display:none}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:99;
  background:var(--raised);border:1px solid var(--line-2);border-radius:99px;padding:11px 20px;
  font-size:13.5px;font-weight:500;box-shadow:var(--sh-3);animation:rise .25s var(--ease);max-width:88vw;text-align:center}
@media(min-width:901px){.toast{bottom:28px}}

/* ---------- video ---------- */
.vthumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;
  background:var(--sunk);border:0;cursor:pointer;display:block;padding:0}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.vthumb:hover img{transform:scale(1.04)}
.vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,8,12,.5),rgba(6,8,12,.08))}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;z-index:2;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));display:grid;place-items:center;
  box-shadow:0 8px 24px -6px rgba(0,0,0,.6)}
.vplay::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r-sm);background:#000;display:block}
.done-dot{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--line-2);flex:none;display:grid;
  place-items:center;background:none;cursor:pointer;padding:0;transition:background .18s var(--ease),border-color .18s}
.done-dot:hover{border-color:var(--accent)}
.done-dot.on{background:var(--up);border-color:var(--up)}
.done-dot.on::after{content:"";width:9px;height:5px;border-left:2.2px solid var(--bg);border-bottom:2.2px solid var(--bg);
  transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- misc ---------- */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;

.banner .ico{flex:none;margin-top:2px}
details.term{border-bottom:1px solid var(--line)}
details.term:last-child{border-bottom:0}

details.term summary::after{content:"";width:8px;height:8px;border-right:1.8px solid var(--faint);border-bottom:1.8px solid var(--faint);
  transform:rotate(45deg);margin-left:auto;margin-right:6px;transition:transform .2s var(--ease)}
details.term[open] summary::after{transform:rotate(225deg)}
details.term .body{padding:0 4px 16px;font-size:14px;color:var(--dim);line-height:1.65}
details.term .body p{margin:0 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--faint);font-size:12px;white-space:nowrap}
.kv dd{margin:0;color:var(--dim);line-height:1.6}
@media(max-width:520px){.kv{grid-template-columns:1fr;gap:3px 0}.kv dd{margin-bottom:10px}}
.hide{display:none!important}
.tv-wrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sunk);
  height:clamp(380px,62vh,700px)}
.tv-wrap iframe{width:100%;height:100%;border:0;display:block}
pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;
  overflow-x:auto;font-family:var(--m);font-size:12.5px;line-height:1.6;margin:0;white-space:pre;color:var(--dim)}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);border-top-color:currentColor;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.dropzone{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;
  cursor:pointer;transition:border-color .18s,background .18s}

</style>

<body>
<div id="root"></div>
<script>
/* ============================================================
   BENCH — trading desk, backtest bench, rulebook, academy
   Single-page PWA. Data is encrypted at rest and synced via a
   private GitHub Gist. No server, no analytics, no trackers.
   ============================================================ */
'use strict';

const APP = { name: 'BENCH', tagline: 'Trading bench', schema: 3 };

/* ---------- tiny utils ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const todayISO = () => new Date().toLocaleDateString('en-CA');
const nowTime = () => new Date().toTimeString().slice(0, 5);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fmtDate(iso, style = 'short') {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d)) return iso;
  return style === 'long'
    ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function fmtR(r, dp = 2) {
  if (r == null || !isFinite(r)) return '—';
  return (r > 0 ? '+' : '') + r.toFixed(dp) + 'R';
}
function fmtMoney(v, cur = 'GBP') {
  if (v == null || !isFinite(v)) return '—';
  const s = new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(Math.abs(v));
  return (v < 0 ? '−' : '') + s;
}
function fmtPct(v, dp = 0) { return v == null || !isFinite(v) ? '—' : v.toFixed(dp) + '%'; }
function download(name, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- storage (falls back to memory in sandboxed previews) ---------- */
const LS = (() => {
  try { const k = '__bench_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; }
  catch (e) {
    const m = new Map();
    return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k), _mem: true };
  }
})();
const K = {
  profiles: 'bench.profiles',
  data: id => 'bench.data.' + id,
  quick: id => 'bench.quick.' + id,
  last: 'bench.last',
  theme: 'bench.theme'
};

/* ---------- crypto (AES-GCM + PBKDF2, same shape as B.O.B.) ---------- */
const ENC = new TextEncoder(), DEC = new TextDecoder();
function toB64(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, saltB64, iterations = 250000) {
  const base = await crypto.subtle.importKey('raw', ENC.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: fromB64(saltB64), iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
  );
}
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, ENC.encode(JSON.stringify(obj)));
  return { v: 1, iv: toB64(iv), ct: toB64(ct) };
}
async function open_(key, blob) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.iv) }, key, fromB64(blob.ct));
  return JSON.parse(DEC.decode(pt));
}

/* ---------- profiles ---------- */
const Profiles = {
  all() { try { return JSON.parse(LS.getItem(K.profiles) || '[]'); } catch { return []; } },
  save(list) { LS.setItem(K.profiles, JSON.stringify(list)); },
  find(id) { return this.all().find(p => p.id === id); },
  async create(name, pass) {
    const salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
    const p = { id: uid(), name: name.trim(), salt, iter: 250000, created: new Date().toISOString() };
    const key = await deriveKey(pass, p.salt, p.iter);
    const list = this.all(); list.push(p); this.save(list);
    LS.setItem(K.data(p.id), JSON.stringify(await seal(key, freshState(p.name))));
    return { profile: p, key };
  },
  async unlock(id, pass) {
    const p = this.find(id); if (!p) throw new Error('Profile not found');
    const key = await deriveKey(pass, p.salt, p.iter);
    const raw = LS.getItem(K.data(id));
    if (!raw) return { profile: p, key, state: freshState(p.name) };
    let st;
    try { st = await open_(key, JSON.parse(raw)); }
    catch { throw new Error('WRONG_PASS'); }
    return { profile: p, key, state: migrate(st) };
  },
  remove(id) {
    this.save(this.all().filter(p => p.id !== id));
    LS.removeItem(K.data(id)); LS.removeItem(K.quick(id));
  }
};

/* ---------- quick unlock (device biometric / screen lock) ---------- */
const Quick = {
  supported() { return !!(window.PublicKeyCredential && navigator.credentials); },
  has(id) { return !!LS.getItem(K.quick(id)); },
  async enable(profile, key) {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: 'Bench', id: location.hostname },
        user: { id: ENC.encode(profile.id), name: profile.name, displayName: profile.name },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000, attestation: 'none'
      }
    });
    if (!cred) throw new Error('No credential');
    const raw = await crypto.subtle.exportKey('raw', key);
    const id = new Uint8Array(cred.rawId), out = new Uint8Array(raw);
    for (let i = 0; i < out.length; i++) out[i] ^= id[i % id.length];   // bind blob to this credential
    LS.setItem(K.quick(profile.id), JSON.stringify({ cred: toB64(cred.rawId), k: toB64(out) }));
  },
  disable(id) { LS.removeItem(K.quick(id)); },
  async unlock(profile) {
    const rec = JSON.parse(LS.getItem(K.quick(profile.id)));
    const got = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type: 'public-key', id: fromB64(rec.cred) }],
        userVerification: 'required', timeout: 60000
      }
    });
    if (!got) throw new Error('Cancelled');
    const id = new Uint8Array(got.rawId), out = fromB64(rec.k);
    for (let i = 0; i < out.length; i++) out[i] ^= id[i % id.length];
    const key = await crypto.subtle.importKey('raw', out, 'AES-GCM', true, ['encrypt', 'decrypt']);
    const st = await open_(key, JSON.parse(LS.getItem(K.data(profile.id))));
    return { key, state: migrate(st) };
  }
};

/* ---------- GitHub Gist sync ---------- */
const Gist = {
  async req(pat, path, opts = {}) {
    const r = await fetch('https://api.github.com' + path, {
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + pat,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.body ? { 'Content-Type': 'application/json' } : {})
      }
    });
    if (!r.ok) {
      const msg = r.status === 401 ? 'Token rejected. Check the token is valid and has the "gist" scope.'
        : r.status === 404 ? 'Gist not found for this token.'
        : 'GitHub returned ' + r.status + '.';
      throw new Error(msg);
    }
    return r.json();
  },
  file(profileId) { return 'bench-' + profileId + '.json'; },
  async create(pat, filename, content) {
    const g = await this.req(pat, '/gists', {
      method: 'POST',
      body: JSON.stringify({ description: 'Bench — encrypted trading journal', public: false, files: { [filename]: { content } } })
    });
    return g.id;
  },
  async push(pat, gistId, filename, content) {
    await this.req(pat, '/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [filename]: { content } } }) });
  },
  async pull(pat, gistId, filename) {
    const g = await this.req(pat, '/gists/' + gistId);
    const f = g.files[filename] || Object.values(g.files).find(x => x.filename.startsWith('bench-'));
    if (!f) throw new Error('No Bench file inside that gist.');
    if (f.truncated) { const r = await fetch(f.raw_url); return r.text(); }
    return f.content;
  }
};

/* ---------- state ---------- */
function freshState(name) {
  return {
    schema: APP.schema,
    updatedAt: new Date().toISOString(),
    owner: name,
    settings: {
      currency: 'GBP', account: 1000, riskPct: 1, theme: 'dark',
      maxDailyLossR: 3, maxTradesPerDay: 4, minSample: 100,
      sync: { pat: '', gistId: '', auto: true, lastPush: '', lastPull: '' },
      ai: { key: '', model: 'claude-sonnet-5' },
      charts: { symbols: ['OANDA:EURUSD', 'PEPPERSTONE:NAS100', 'OANDA:XAUUSD', 'NASDAQ:AAPL', 'BINANCE:BTCUSDT'], interval: '15' }
    },
    plan: '',
    trades: [],
    runs: [],
    strategies: [],
    rules: STARTER_RULES.map(r => ({ id: uid(), text: r.text, category: r.category, mandatory: r.mandatory, active: true, created: new Date().toISOString() })),
    playlists: STARTER_PLAYLISTS.map(p => ({ id: uid(), title: p.title, note: p.note, videos: [] })),
    reviews: [],
    platforms: STARTER_PLATFORMS.map(p => ({ id: uid(), ...p })),
    terms: []
  };
}
function migrate(st) {
  st.schema = APP.schema;
  st.settings = Object.assign(freshState(st.owner || '').settings, st.settings || {});
  st.settings.sync = Object.assign({ pat: '', gistId: '', auto: true, lastPush: '', lastPull: '' }, st.settings.sync || {});
  st.settings.ai = Object.assign({ key: '', model: 'claude-sonnet-5' }, st.settings.ai || {});
  st.settings.charts = Object.assign({ symbols: ['OANDA:EURUSD', 'PEPPERSTONE:NAS100', 'OANDA:XAUUSD'], interval: '15' }, st.settings.charts || {});
  for (const k of ['trades', 'runs', 'strategies', 'rules', 'playlists', 'reviews', 'platforms', 'terms'])
    if (!Array.isArray(st[k])) st[k] = [];
  if (typeof st.plan !== 'string') st.plan = '';
  return st;
}

/* ============================================================
   SEED CONTENT
   ============================================================ */

const STARTER_RULES = [
  { text: 'I only take setups that appear in my written playbook.', category: 'Entry', mandatory: true },
  { text: 'I know my invalidation level before I click buy or sell.', category: 'Risk', mandatory: true },
  { text: 'I risk no more than my planned % of account on this trade.', category: 'Risk', mandatory: true },
  { text: 'The setup offers at least 2R to the first target.', category: 'Entry', mandatory: true },
  { text: 'I checked the economic calendar for high-impact news.', category: 'Preparation', mandatory: true },
  { text: 'I am trading my plan, not chasing a loss or extending a win.', category: 'Psychology', mandatory: true },
  { text: 'I did not move my stop further from entry once placed.', category: 'Exit', mandatory: true },
  { text: 'I am within my daily loss limit and trade count.', category: 'Risk', mandatory: true },
  { text: 'I screenshotted the chart at entry for the journal.', category: 'Process', mandatory: false },
  { text: 'I am rested, fed, and not trading to feel something.', category: 'Psychology', mandatory: false }
];

const STARTER_PLAYLISTS = [
  { title: 'Foundations', note: 'How markets actually work: order flow, liquidity, spreads, sessions.' },
  { title: 'Risk and position sizing', note: 'The only module that decides whether you survive long enough to get good.' },
  { title: 'Strategy and backtesting', note: 'Building a testable edge, sample sizes, forward testing.' },
  { title: 'Psychology and discipline', note: 'Tilt, revenge trading, and executing a plan you already wrote.' },
  { title: 'Platform and execution', note: 'Order types, charting, hotkeys, journaling workflow.' }
];

const STARTER_PLATFORMS = [
  { name: 'TradingView', url: 'https://www.tradingview.com/chart/', colour: '#2962FF', note: 'Charting and alerts' },
  { name: 'MetaTrader 5 Web', url: 'https://trade.metatrader5.com/', colour: '#E8A33D', note: 'Broker terminal' },
  { name: 'Forex Factory calendar', url: 'https://www.forexfactory.com/calendar', colour: '#B34747', note: 'High-impact news' },
  { name: 'Investing.com calendar', url: 'https://www.investing.com/economic-calendar/', colour: '#5BC8E8', note: 'Backup calendar' },
  { name: 'Myfxbook', url: 'https://www.myfxbook.com/', colour: '#4FD1A1', note: 'Account analytics' },
  { name: 'Finviz', url: 'https://finviz.com/', colour: '#8A7CE8', note: 'Equity screener and heatmap' }
];

/* ---------- glossary ---------- */
const TERMS = [
  ['Ask', 'Orders & execution', 'The lowest price a seller will currently accept. You buy at the ask.'],
  ['Bid', 'Orders & execution', 'The highest price a buyer will currently pay. You sell at the bid.'],
  ['Spread', 'Orders & execution', 'The gap between bid and ask. It is a cost you pay on entry and again on exit, and it widens around news and at session opens.'],
  ['Slippage', 'Orders & execution', 'The difference between the price you expected and the price you got. Usually worse in fast markets and on stop orders.'],
  ['Market order', 'Orders & execution', 'Fills immediately at the best available price. Certain fill, uncertain price.'],
  ['Limit order', 'Orders & execution', 'Fills only at your price or better. Certain price, uncertain fill.'],
  ['Stop order', 'Orders & execution', 'Becomes a market order once price trades through your level. Used to cut losses or to enter on breakouts.'],
  ['Stop-limit order', 'Orders & execution', 'Triggers at a stop price then works as a limit. Protects against slippage but can leave you unfilled in a fast move.'],
  ['OCO', 'Orders & execution', 'One-cancels-other. A stop and a target placed together; filling one cancels the other.'],
  ['Trailing stop', 'Orders & execution', 'A stop that follows price by a fixed distance or rule, locking in gains as the trade runs.'],
  ['Fill', 'Orders & execution', 'The execution of your order. Partial fills happen when there is not enough size at your price.'],
  ['Liquidity', 'Market structure', 'How much size can trade without moving price. Thin liquidity means wider spreads and worse fills.'],
  ['Order book / depth of market', 'Market structure', 'The live ladder of resting bids and offers at each price level.'],
  ['Volume', 'Market structure', 'How many units traded in a period. Rising volume on a move suggests genuine participation.'],
  ['Open interest', 'Derivatives & FX', 'The number of derivative contracts still open. Rising price with rising open interest suggests new money entering.'],
  ['Session', 'Market structure', 'Asia, London and New York. Volatility, spread and typical behaviour differ sharply between them.'],
  ['Gap', 'Market structure', 'A price jump between one bar close and the next bar open, common on stocks over the weekend or after earnings.'],
  ['Support', 'Price action', 'A level where buying has repeatedly appeared. It is an area, not a line.'],
  ['Resistance', 'Price action', 'A level where selling has repeatedly appeared. Once broken it often acts as support.'],
  ['Higher high / higher low', 'Price action', 'The definition of an uptrend. The trend is intact until a lower low prints.'],
  ['Break of structure (BOS)', 'Price action', 'Price closing beyond the prior swing point, signalling trend continuation.'],
  ['Change of character (CHoCH)', 'Price action', 'The first break against the prevailing sequence of highs and lows, a possible trend turn.'],
  ['Pullback / retracement', 'Price action', 'A counter-trend move inside a larger trend. Trend traders wait for these rather than chase.'],
  ['Consolidation / range', 'Price action', 'Price moving sideways between two boundaries while participants agree on value.'],
  ['Breakout', 'Price action', 'Price leaving a range or level with intent. Failed breakouts are common and tradeable in themselves.'],
  ['Fakeout / stop hunt', 'Price action', 'A brief push past a level that reverses, typically triggering stops before the real move.'],
  ['Fair value gap (FVG)', 'Price action', 'A three-bar imbalance where price moved so fast it left an unfilled zone. Often revisited.'],
  ['Order block', 'Price action', 'The last opposing candle before an impulsive move, treated as an area where large orders were placed.'],
  ['Liquidity sweep', 'Price action', 'Price running through an obvious cluster of stops before reversing.'],
  ['Supply and demand zone', 'Price action', 'An area price left rapidly, marked as a likely reaction point on return.'],
  ['Candlestick', 'Price action', 'A bar showing open, high, low and close for a period. The body is open-to-close; wicks are the extremes.'],
  ['Engulfing bar', 'Price action', 'A candle whose body fully covers the previous one, showing a shift in control.'],
  ['Pin bar / rejection', 'Price action', 'A long wick showing price was tested and refused. Stronger at a level that already matters.'],
  ['Inside bar', 'Price action', 'A candle contained inside the previous range. Compression that often precedes expansion.'],
  ['Moving average (MA)', 'Indicators', 'The average close over N periods. Simple weights all bars equally; exponential weights recent bars more.'],
  ['Golden cross / death cross', 'Indicators', 'A shorter MA crossing above (golden) or below (death) a longer one. Slow, popular, and heavily lagging.'],
  ['RSI', 'Indicators', 'Relative Strength Index, 0–100, measuring the size of recent gains against losses. Overbought is not a sell signal in a trend.'],
  ['MACD', 'Indicators', 'The difference between two EMAs plus a signal line. Reads momentum shifts, lags at turns.'],
  ['ATR', 'Indicators', 'Average True Range, the typical bar range over N periods. The cleanest way to size stops to current volatility.'],
  ['Bollinger Bands', 'Indicators', 'A moving average with bands at N standard deviations. Band width measures volatility, not direction.'],
  ['VWAP', 'Indicators', 'Volume weighted average price for the session. Widely used by institutions as a benchmark and a mean.'],
  ['Stochastic', 'Indicators', 'Where the close sits within the recent range. Useful in ranges, noisy in trends.'],
  ['Fibonacci retracement', 'Indicators', 'Ratios (38.2%, 50%, 61.8%) drawn across a swing to anticipate pullback depth.'],
  ['Divergence', 'Indicators', 'Price makes a new extreme but the oscillator does not. A warning, not a trigger.'],
  ['Position size', 'Risk & sizing', 'How many units you buy or sell. Derived from risk per trade and stop distance — never guessed.'],
  ['Risk per trade', 'Risk & sizing', 'The cash you accept losing if the stop hits, usually 0.5–2% of account.'],
  ['R (risk unit)', 'Risk & sizing', 'One R is your initial risk on a trade. Measuring results in R makes trades comparable across account sizes.'],
  ['R-multiple', 'Metrics', 'Result divided by initial risk. A trade that made three times what it risked is +3R.'],
  ['Risk:reward', 'Risk & sizing', 'Planned reward divided by planned risk. A 1:3 setup only needs to win 25% of the time to break even.'],
  ['Leverage', 'Derivatives & FX', 'Controlling a large position with a small deposit. It multiplies both the gain and the speed of ruin.'],
  ['Margin', 'Derivatives & FX', 'The deposit your broker holds against an open leveraged position.'],
  ['Margin call', 'Derivatives & FX', 'A demand for more funds when equity falls below the required margin. Ignore it and positions get closed for you.'],
  ['Drawdown', 'Metrics', 'The fall from an equity peak to the following trough. Maximum drawdown is the worst one on record.'],

/* ============================================================
   ANALYTICS
   ============================================================ */

/** R-multiple for a trade. Manual value wins; otherwise derived from entry/stop/exit. */
function tradeR(t) {
  const m = num(t.rManual);
  if (m !== null) return m;
  const e = num(t.entry), s = num(t.stop), x = num(t.exit);
  if (e === null || s === null || x === null || e === s) return null;
  const risk = Math.abs(e - s);
  const move = t.direction === 'Short' ? e - x : x - e;
  return move / risk;
}
function tradePnl(t, settings) {
  const m = num(t.pnlManual);
  if (m !== null) return m;
  const r = tradeR(t);
  const risked = num(t.riskAmount);
  if (r === null) return null;
  if (risked !== null) return r * risked - (num(t.fees) || 0);
  const acct = num(settings?.account), pct = num(settings?.riskPct);
  if (acct !== null && pct !== null) return r * (acct * pct / 100) - (num(t.fees) || 0);
  return null;
}
function outcomeOf(t) {
  if (t.status !== 'Closed') return 'Open';
  const r = tradeR(t);
  if (r === null) return 'Open';
  if (r > 0.05) return 'Win';
  if (r < -0.05) return 'Loss';
  return 'Break-even';
}

function stats(list, settings) {
  const closed = list.filter(t => t.status === 'Closed' && tradeR(t) !== null)
    .slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const rs = closed.map(tradeR);
  const wins = rs.filter(r => r > 0.05), losses = rs.filter(r => r < -0.05);
  const be = rs.length - wins.length - losses.length;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const totalR = sum(rs);
  const avgWin = wins.length ? sum(wins) / wins.length : null;
  const avgLoss = losses.length ? sum(losses) / losses.length : null;
  const grossW = sum(wins), grossL = Math.abs(sum(losses));

  // equity curve + drawdown, in R
  const curve = []; let acc = 0, peak = 0, maxDD = 0, ddNow = 0;
  for (const r of rs) { acc += r; curve.push(acc); peak = Math.max(peak, acc); ddNow = peak - acc; maxDD = Math.max(maxDD, ddNow); }

  // streaks
  let cw = 0, cl = 0, bw = 0, bl = 0;
  for (const r of rs) {
    if (r > 0.05) { cw++; cl = 0; bw = Math.max(bw, cw); }
    else if (r < -0.05) { cl++; cw = 0; bl = Math.max(bl, cl); }
    else { cw = 0; cl = 0; }
  }

  // rule adherence
  let followed = 0, checked = 0;
  for (const t of list) { if (t.rulesTotal) { checked += t.rulesTotal; followed += (t.rulesFollowed || []).length; } }

  const pnls = closed.map(t => tradePnl(t, settings)).filter(v => v !== null);

  return {
    n: closed.length, open: list.filter(t => t.status !== 'Closed').length,
    wins: wins.length, losses: losses.length, be,
    winRate: closed.length ? (wins.length / closed.length) * 100 : null,
    totalR, expectancy: closed.length ? totalR / closed.length : null,
    avgWin, avgLoss,
    payoff: avgWin !== null && avgLoss ? avgWin / Math.abs(avgLoss) : null,
    profitFactor: grossL > 0 ? grossW / grossL : (grossW > 0 ? Infinity : null),
    maxDD, ddNow, curve,
    bestWinStreak: bw, worstLossStreak: bl,
    adherence: checked ? (followed / checked) * 100 : null,
    pnl: pnls.length ? pnls.reduce((a, b) => a + b, 0) : null,
    best: rs.length ? Math.max(...rs) : null,
    worst: rs.length ? Math.min(...rs) : null
  };
}

/** Group trades by a key function and return sorted stat rows. */
function groupStats(list, keyFn, settings) {
  const map = new Map();
  for (const t of list) {
    const k = keyFn(t) || '—';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  }
  return [...map.entries()]
    .map(([k, v]) => ({ key: k, n: v.filter(t => t.status === 'Closed').length, ...stats(v, settings) }))
    .filter(r => r.n > 0)
    .sort((a, b) => b.totalR - a.totalR);
}

/* ---------- equity chart ---------- */
function scope(values, opts = {}) {
  const W = 600, H = 200, padY = 20;
  const defs = `<defs>
    <linearGradient id="gline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient>
    <linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--accent);stop-opacity:.26"/>
      <stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
  </defs>`;
  const grid = [1, 2, 3].map(i => `<line class="gridline" x1="0" y1="${(H / 4) * i}" x2="${W}" y2="${(H / 4) * i}"/>`).join('');

  if (!values || values.length < 2) {
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="No data yet">${defs}${grid}</svg>
      <div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center">
        <div class="small faint">Log a closed trade and the curve starts here.</div></div>`;
  }
  const series = [0, ...values];
  const lo = Math.min(0, ...series), hi = Math.max(0, ...series);
  const span = (hi - lo) || 1;
  const x = i => (i / (series.length - 1)) * W;
  const y = v => padY + (1 - (v - lo) / span) * (H - padY * 2);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const anim = opts.animate === false ? '' : ' data-sweep';
  const last = series[series.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Equity curve in R">
    ${defs}${grid}
    <polygon class="trace-fill"${anim} points="0,${H} ${pts} ${W},${H}"/>
    <polyline class="trace"${anim} points="${pts}"/>
  </svg>`;
}

/* ---------- mini bar for group tables ---------- */
function miniBar(v, max) {
  const pct = max > 0 ? clamp(Math.abs(v) / max * 100, 0, 100) : 0;
  const col = v >= 0 ? 'var(--up)' : 'var(--down)';
  return `<span style="display:inline-block;width:52px;height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;vertical-align:middle">

function toast(msg, ms = 2400) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/** Modal sheet. Returns the sheet element; resolve/close via closeModal(). */
let modalResolve = null;
function modal({ title, body, footer, onOpen, wide }) {
  closeModal();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="max-width:940px"' : ''}>
    <div class="grabber"></div>
    <div class="sheet-h"><h2>${esc(title)}</h2>
      <button class="btn icon ghost" data-act="modal.close" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">${body}</div>
    ${footer ? `<div class="sheet-f">${footer}</div>` : ''}
  </div>`;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeModal(); });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  const first = scrim.querySelector('input,select,textarea,button.primary');
  if (first && window.matchMedia('(min-width:901px)').matches) setTimeout(() => first.focus(), 60);
  onOpen && onOpen(scrim);
  return scrim;
}
function closeModal() {
  $$('.scrim').forEach(s => s.remove());
  document.body.style.overflow = '';
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(false); }
}
function confirmDialog(title, message, danger = 'Delete') {
  closeModal();
  return new Promise(res => {
    modal({
      title,
      body: `<p class="muted" style="margin:0">${esc(message)}</p>`,
      footer: `<button class="btn ghost" data-act="modal.close">Keep it</button>
               <button class="btn danger" data-act="modal.confirm">${esc(danger)}</button>`
    });
    modalResolve = res;   // set after modal(), so its own closeModal() cannot consume it
  });
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* form helpers */
const field = (label, inner) => `<label class="f"><span>${esc(label)}</span>${inner}</label>`;
const inp = (name, val = '', attrs = '') => `<input name="${name}" ${attrs} value="${esc(val)}">`;
const area = (name, val = '', ph = '') => `<textarea name="${name}" placeholder="${esc(ph)}">${esc(val)}</textarea>`;
const sel = (name, val, opts) => `<select name="${name}">${opts.map(o => {
  const [v, l] = Array.isArray(o) ? o : [o, o];
  return `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(l)}</option>`;
}).join('')}</select>`;
function formData(scope) {
  const o = {};
  $$('input,select,textarea', scope).forEach(el => {
    if (!el.name) return;
    if (el.type === 'checkbox') { if (!Array.isArray(o[el.name])) o[el.name] = []; if (el.checked) o[el.name].push(el.value); }
    else o[el.name] = el.value.trim();
  });
  return o;
}

async function persist() {
  if (!S.key || !S.st) return;

  } else if (mode === 'unlock') {
    const p = Profiles.find(ctx.id);

        ${field('Passphrase', `<input type="password" name="pass" autocomplete="current-password" autofocus>`)}

        <button class="btn primary" type="submit" style="width:100%">Unlock</button>
        ${Quick.has(p.id) ? `<button type="button" class="btn" data-act="quick" data-id="${p.id}" style="width:100%">${icon('lock')} Use device unlock</button>` : ''}
        <button type="button" class="btn ghost" data-act="mode" data-mode="pick" style="width:100%">Back</button>
      </form>`;
  } else if (mode === 'new') {
    body = `<p class="lock-sub">Your journal is encrypted with this passphrase. It is never sent anywhere and cannot be reset — write it down.</p>
      <form id="newForm" class="stack">
        ${field('Profile name', `<input name="name" autocomplete="nickname" placeholder="e.g. Emil" autofocus>`)}
        ${field('Passphrase', `<input type="password" name="pass" autocomplete="new-password">`)}
        ${field('Confirm passphrase', `<input type="password" name="pass2" autocomplete="new-password">`)}
        <div class="tiny down" id="lockErr"></div>
        <button class="btn primary" type="submit" style="width:100%">Create profile</button>
        ${list.length ? `<button type="button" class="btn ghost" data-act="mode" data-mode="pick" style="width:100%">Back</button>` : ''}
      </form>`;
  } else if (mode === 'restore') {
    body = `<p class="lock-sub">Pull an encrypted journal from a private gist onto this device.</p>
      <form id="restoreForm" class="stack">
        ${field('Profile name', `<input name="name" placeholder="Any name you like">`)}
        ${field('GitHub token', `<input type="password" name="pat" placeholder="ghp_… (gist scope)">`)}
        ${field('Gist ID', `<input name="gistId" placeholder="From the gist URL">`)}
        ${field('Passphrase', `<input type="password" name="pass">`)}
        <div class="tiny down" id="lockErr"></div>
        <button class="btn primary" type="submit" style="width:100%">Restore journal</button>
        <button type="button" class="btn ghost" data-act="mode" data-mode="pick" style="width:100%">Back</button>
      </form>`;
  }

  root.innerHTML = `<div class="lock"><div class="lockbox">${shellTop}${body}
    <p class="tiny faint" style="text-align:center;margin-top:22px">${LS._mem ? 'Preview mode — this browser is blocking storage, so nothing will be saved.' : 'Encrypted on this device with AES-GCM.'}</p>
  </div></div>`;

  const err = m => { const e = $('#lockErr'); if (e) e.textContent = m; };

  $('#unlockForm')?.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Unlocking…';
    try {
      const { profile, key, state } = await Profiles.unlock(ctx.id, formData(e.target).pass);
      boot(profile, key, state);
    } catch (ex) {
      err(ex.message === 'WRONG_PASS' ? 'That passphrase does not match.' : ex.message);
      btn.disabled = false; btn.textContent = 'Unlock';
    }
  });

  $('#newForm')?.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const d = formData(e.target);
    if (!d.name) return err('Give the profile a name.');
    if (d.pass.length < 8) return err('Use at least 8 characters.');
    if (d.pass !== d.pass2) return err('The two passphrases do not match.');
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Creating…';
    const { profile, key } = await Profiles.create(d.name, d.pass);
    const st = (await Profiles.unlock(profile.id, d.pass)).state;
    boot(profile, key, st);
  });

  $('#restoreForm')?.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const d = formData(e.target);
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Restoring…';
    try {
      const raw = await Gist.pull(d.pat, d.gistId.trim(), '');
      const pkg = JSON.parse(raw);
      const key = await deriveKey(d.pass, pkg.salt, pkg.iter || 250000);
      const state = migrate(await open_(key, pkg.blob));
      const p = { id: uid(), name: d.name || state.owner || 'Restored', salt: pkg.salt, iter: pkg.iter || 250000, created: new Date().toISOString() };
      const all = Profiles.all(); all.push(p); Profiles.save(all);
      state.settings.sync.pat = d.pat; state.settings.sync.gistId = d.gistId.trim();
      LS.setItem(K.data(p.id), JSON.stringify(await seal(key, state)));
      boot(p, key, state);
      toast('Journal restored.');
    } catch (ex) {
      err(ex.name === 'OperationError' ? 'Passphrase does not match that gist.' : ex.message);
      btn.disabled = false; btn.textContent = 'Restore journal';
    }
  });

  root.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'pick') renderLock('unlock', { id: b.dataset.id });
    if (b.dataset.act === 'mode') renderLock(b.dataset.mode);
    if (b.dataset.act === 'quick') doQuickUnlock(b.dataset.id);
  };
}

async function doQuickUnlock(id) {
  const p = Profiles.find(id);
  try { const { key, state } = await Quick.unlock(p); boot(p, key, state); }
  catch (e) { toast('Device unlock cancelled — use your passphrase.'); }
}

  $('#root').onclick = null;
  S.profile = profile; S.key = key; S.st = state;
  LS.setItem(K.last, profile.id);
  applyTheme(state.settings.theme);
  renderShell(); go('desk');
  if (state.settings.sync.gistId && state.settings.sync.pat && state.settings.sync.auto) setTimeout(() => syncPull(true), 800);
}

VIEWS.desk = () => {
  const st = S.st, set = st.settings;
  const mode = S.params.mode || 'live';
  const pool = mode === 'all' ? st.trades : st.trades.filter(t => (t.mode || 'live') === mode);
  const s = stats(pool, set);

  const today = todayISO();
  const todays = st.trades.filter(t => t.date === today && (t.mode || 'live') === 'live');
  const todayR = todays.filter(t => t.status === 'Closed').reduce((a, t) => a + (tradeR(t) || 0), 0);
  const overLoss = todayR <= -Math.abs(set.maxDailyLossR);

  const recent = st.trades.slice().sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))).slice(0, 6);

  const maxAbs = Math.max(1, ...byStrat.map(r => Math.abs(r.totalR)));

/** Which strategy family a trade belongs to, via its tagged strategy. */

/** Win-rate bar: green share vs red share. */
function wrBar(win, loss, be) {
  const t = win + loss + be || 1;
  return `<span class="wrbar" style="width:64px;display:inline-flex;vertical-align:middle">
    <i style="width:${win / t * 100}%;background:var(--up)"></i>
    <i style="width:${be / t * 100}%;background:var(--line-2)"></i>
    <i style="width:${loss / t * 100}%;background:var(--down)"></i></span>`;
}

/* ---------- TRADES ---------- */
VIEWS.trades = () => {
  const st = S.st, set = st.settings, f = S.params;
  const mode = f.mode || 'all', strat = f.strat || '', oc = f.oc || '', q = (f.q || '').toLowerCase();

  let list = st.trades.slice();
  if (mode !== 'all') list = list.filter(t => (t.mode || 'live') === mode);
  if (strat) list = list.filter(t => t.strategyId === strat);
  if (oc) list = list.filter(t => outcomeOf(t) === oc);
  if (q) list = list.filter(t => (t.instrument + ' ' + (t.notes || '') + ' ' + (t.tags || []).join(' ')).toLowerCase().includes(q));
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));

  const s = stats(list, set);

  return {
    title: 'Trades',
    actions: `<button class="btn sm ghost" data-act="trades.csv">Export CSV</button>
              <button class="btn primary" data-act="trade.new">${icon('plus')} Log trade</button>`,
    html: `
    <div class="card" style="padding:12px">
      <div class="row">
        <div class="seg">${[['all', 'All'], ['live', 'Live'], ['backtest', 'Backtest'], ['demo', 'Demo']].map(([v, l]) =>

        <div class="seg">${[['', 'Any result'], ['Win', 'Wins'], ['Loss', 'Losses'], ['Open', 'Open']].map(([v, l]) =>
          `<button class="${oc === v ? 'on' : ''}" data-act="trades.filter" data-k="oc" data-v="${v}">${l}</button>`).join('')}</div>
        <div class="spacer"></div>
        <input id="tq" placeholder="Search instrument, tag, note" value="${esc(f.q || '')}" style="max-width:230px">
      </div>
      ${st.strategies.length ? `<div class="row" style="margin-top:10px">
        <button class="chip ${!strat ? 'on' : ''}" data-act="trades.filter" data-k="strat" data-v="">All strategies</button>
        ${st.strategies.map(x => `<button class="chip ${strat === x.id ? 'on' : ''}" data-act="trades.filter" data-k="strat" data-v="${x.id}">${esc(x.name)}</button>`).join('')}
      </div>` : ''}
    </div>

    <div class="grid g3" style="margin:14px 0">
      <div class="tile"><span class="k">Shown</span><span class="v">${list.length}</span></div>
      <div class="tile"><span class="k">Net</span><span class="v ${s.totalR >= 0 ? 'up' : 'down'}">${s.n ? fmtR(s.totalR, 1) : '—'}</span></div>
      <div class="tile"><span class="k">Expectancy</span><span class="v">${s.expectancy != null ? fmtR(s.expectancy) : '—'}</span></div>
      <div class="tile"><span class="k">Win rate</span><span class="v">${fmtPct(s.winRate)}</span></div>
    </div>

    <div class="card" style="padding:6px 10px">
      ${list.length ? `<div class="scroll-x"><table class="tbl">
        <thead><tr><th>Date</th><th>Instrument</th><th class="opt">Dir</th><th class="opt">Strategy</th>
          <th class="opt">Session</th><th class="num">R</th><th class="num opt">P&amp;L</th><th class="opt">Rules</th></tr></thead>
        <tbody>${list.map(t => {
          const r = tradeR(t), p = tradePnl(t, set), adh = t.rulesTotal ? (t.rulesFollowed || []).length / t.rulesTotal : null;
          return `<tr data-act="trade.open" data-id="${t.id}">
            <td class="mono tiny">${fmtDate(t.date)}</td>
            <td><strong>${esc(t.instrument || '—')}</strong>${(t.mode || 'live') !== 'live' ? ` <span class="chip on tiny">${esc((t.mode || '').slice(0, 2).toUpperCase())}</span>` : ''}</td>
            <td class="opt tiny ${t.direction === 'Short' ? 'down' : 'up'}">${esc(t.direction || '')}</td>

            <td class="opt tiny muted">${esc(t.session || '—')}</td>

            <td class="num opt ${(p || 0) >= 0 ? '' : 'down'}">${p == null ? '—' : fmtMoney(p, set.currency)}</td>
            <td class="opt tiny ${adh != null && adh < 1 ? 'down' : 'muted'}">${adh == null ? '—' : Math.round(adh * 100) + '%'}</td>

        : emptyState('No trades match', 'Change the filters, or log the first one.', 'Log trade', 'trade.new')}

    after() {
      const q = $('#tq');
      if (q) q.addEventListener('input', debounce(() => { S.params.q = q.value; render(); setTimeout(() => { const n = $('#tq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 0); }, 280));
    }
  };
};
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- trade editor ---------- */
const SESSIONS = ['Asia', 'London', 'London/NY overlap', 'New York', 'After hours'];
const TFS = ['1m', '3m', '5m', '15m', '30m', '1h', '4h', 'Daily', 'Weekly'];

function tradeSheet(id) {
  const st = S.st, set = st.settings;
  const t = id ? st.trades.find(x => x.id === id) : null;
  const isNew = !t;
  const d = t || {
    id: uid(), mode: 'live', date: todayISO(), time: nowTime(), session: 'London', instrument: '',
    direction: 'Long', strategyId: '', timeframe: '15m', entry: '', stop: '', target: '', exit: '',
    riskAmount: '', fees: '', rManual: '', pnlManual: '', status: 'Open', confidence: '3',
    emotion: '', mistakes: '', tags: [], chartUrl: '', notes: '', rulesChecked: [], rulesFollowed: [], rulesTotal: 0, runId: ''
  };
  const mand = st.rules.filter(r => r.active && r.mandatory);
  const shownRules = t && t.rulesChecked?.length
    ? t.rulesChecked.map(rid => st.rules.find(r => r.id === rid)).filter(Boolean)
    : mand;

  const body = `
  <form id="tradeForm" class="stack" style="gap:16px">
    <div>
      <span class="eyebrow">Setup</span>
      <div class="fgrid" style="margin-top:8px">
        ${field('Mode', sel('mode', d.mode, [['live', 'Live'], ['backtest', 'Backtest'], ['demo', 'Demo']]))}
        ${field('Date', inp('date', d.date, 'type="date"'))}
        ${field('Time', inp('time', d.time, 'type="time"'))}
        ${field('Session', sel('session', d.session, SESSIONS))}
        ${field('Instrument', inp('instrument', d.instrument, 'placeholder="EURUSD, NAS100, AAPL" list="instrList"'))}
        ${field('Direction', sel('direction', d.direction, ['Long', 'Short']))}
        ${field('Strategy', sel('strategyId', d.strategyId, [['', 'Untagged'], ...st.strategies.map(s => [s.id, s.name])]))}
        ${field('Timeframe', sel('timeframe', d.timeframe, TFS))}
      </div>
      <datalist id="instrList">${[...new Set(st.trades.map(x => x.instrument).filter(Boolean))].map(i => `<option value="${esc(i)}">`).join('')}</datalist>
    </div>

    <div>
      <span class="eyebrow">Levels</span>
      <div class="fgrid" style="margin-top:8px">
        ${field('Entry', inp('entry', d.entry, 'type="number" step="any" inputmode="decimal"'))}
        ${field('Stop', inp('stop', d.stop, 'type="number" step="any" inputmode="decimal"'))}
        ${field('Target', inp('target', d.target, 'type="number" step="any" inputmode="decimal"'))}
        ${field('Exit', inp('exit', d.exit, 'type="number" step="any" inputmode="decimal"'))}
        ${field('Status', sel('status', d.status, ['Open', 'Closed']))}
        ${field('R override', inp('rManual', d.rManual, 'type="number" step="any" inputmode="decimal" placeholder="optional"'))}
      </div>
      <div class="tile" style="margin-top:10px;display:flex;gap:20px;align-items:center">
        <span><span class="k">Planned R:R</span><span class="v mono" id="calcRR">—</span></span>
        <span><span class="k">Result</span><span class="v mono" id="calcR">—</span></span>
        <span><span class="k">Cash</span><span class="v mono" id="calcCash">—</span></span>
      </div>
    </div>

    <div>
      <span class="eyebrow">Money</span>
      <div class="fgrid" style="margin-top:8px">
        ${field('Risked (' + set.currency + ')', inp('riskAmount', d.riskAmount, `type="number" step="any" inputmode="decimal" placeholder="${(set.account * set.riskPct / 100).toFixed(2)}"`))}
        ${field('Fees', inp('fees', d.fees, 'type="number" step="any" inputmode="decimal"'))}
        ${field('P&L override', inp('pnlManual', d.pnlManual, 'type="number" step="any" inputmode="decimal" placeholder="optional"'))}
      </div>
    </div>

    ${shownRules.length ? `<div>
      <span class="eyebrow">Rule check — <span id="ruleCount"></span></span>
      <div class="stack" style="gap:6px;margin-top:8px">
        ${shownRules.map(r => `<label class="check ${(d.rulesFollowed || []).includes(r.id) ? 'on' : ''}">
          <input type="checkbox" name="rulesFollowed" value="${r.id}" ${(d.rulesFollowed || []).includes(r.id) ? 'checked' : ''}>
          <span>${esc(r.text)}</span></label>`).join('')}
      </div>

    <div>
      <span class="eyebrow">Execution and state</span>
      <div class="fgrid" style="margin-top:8px">
        ${field('Confidence 1–5', sel('confidence', d.confidence, ['1', '2', '3', '4', '5']))}

      const f = $('#tradeForm', scrim);
      const recalc = () => {
        const v = formData(f);
        const e = num(v.entry), s = num(v.stop), tg = num(v.target), x = num(v.exit);
        const risk = e != null && s != null ? Math.abs(e - s) : null;
        $('#calcRR', scrim).textContent = (risk && tg != null) ? (Math.abs(tg - e) / risk).toFixed(2) + ':1' : '—';

        $('#calcR', scrim).textContent = r == null ? '—' : fmtR(r);
        $('#calcR', scrim).className = 'v mono ' + (r == null ? '' : r >= 0 ? 'up' : 'down');
        const risked = num(v.riskAmount) ?? (set.account * set.riskPct / 100);
        $('#calcCash', scrim).textContent = r == null ? '—' : fmtMoney(r * risked - (num(v.fees) || 0), set.currency);
        const rc = $('#ruleCount', scrim);
        if (rc) { const n = $$('input[name=rulesFollowed]:checked', f).length, tot = $$('input[name=rulesFollowed]', f).length; rc.textContent = `${n} of ${tot} followed`; }
      };
      f.addEventListener('input', e => {
        if (e.target.type === 'checkbox') e.target.closest('.check').classList.toggle('on', e.target.checked);
        recalc();
      });
      f.addEventListener('change', recalc);
      recalc();
    }
  });
}

function readTradeForm() {
  const f = $('#tradeForm'); if (!f) return null;
  const v = formData(f);
  v.tags = (v.tags || '').split(',').map(s => s.trim()).filter(Boolean);
  v.mistakes = (v.mistakes || '').split(',').map(s => s.trim()).filter(Boolean);
  v.rulesChecked = (v.rulesChecked || '').split(',').filter(Boolean);
  v.rulesFollowed = v.rulesFollowed || [];
  v.rulesTotal = v.rulesChecked.length;
  if (v.status === 'Open' && (v.exit !== '' || v.rManual !== '')) v.status = 'Closed';
  return v;
}

/* ---------- BACKTEST BENCH ---------- */
VIEWS.bench = () => {
  const st = S.st, set = st.settings;
  if (S.params.run) return benchRunView(S.params.run);

  const rows = st.runs.map(r => {
    const list = st.trades.filter(t => t.runId === r.id);
    return { run: r, s: stats(list, set) };
  }).sort((a, b) => (b.run.created || '').localeCompare(a.run.created || ''));

  return {
    title: 'Backtest bench',
    actions: `<button class="btn primary" data-act="run.new">${icon('plus')} New test</button>`,
    html: `
    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="eyebrow">How this works</span></div>
      <p class="small muted" style="margin:0">A test is one strategy, one instrument set, one fixed rule set, run over a defined period. Log every trade the rules would have taken — including the losers you would rather forget — then let the numbers decide whether it goes live. ${set.minSample} closed trades is the bar set in your settings.</p>
    </div>
    ${rows.length ? `<div class="grid g2">${rows.map(({ run, s }) => {
      const done = s.n, pct = clamp(done / set.minSample * 100, 0, 100);
      return `<button class="card clickable" data-act="run.open" data-id="${run.id}" style="text-align:left">
        <div class="card-h"><h3>${esc(run.name)}</h3>
          <span class="chip ${run.status === 'Complete' ? 'win' : run.status === 'Abandoned' ? 'loss' : 'on'}">${esc(run.status)}</span></div>
        <div class="tiny faint" style="margin:-6px 0 10px">${esc(strategyName(run.strategyId))} · ${esc(run.market || 'any market')} · ${esc(run.timeframe || '—')}</div>
        <div class="row" style="gap:16px;margin-bottom:10px">
          <span><span class="k eyebrow">Net</span><br><span class="mono ${s.totalR >= 0 ? 'up' : 'down'}" style="font-size:17px">${s.n ? fmtR(s.totalR, 1) : '—'}</span></span>
          <span><span class="k eyebrow">Expectancy</span><br><span class="mono" style="font-size:17px">${s.expectancy != null ? fmtR(s.expectancy) : '—'}</span></span>
          <span><span class="k eyebrow">Win rate</span><br><span class="mono" style="font-size:17px">${fmtPct(s.winRate)}</span></span>
        </div>
        <div class="bar ${pct >= 100 ? 'g' : ''}"><i style="width:${pct}%"></i></div>
        <div class="tiny faint" style="margin-top:5px">${done} of ${set.minSample} trades toward a usable sample</div>
      </button>`; }).join('')}</div>`
      : emptyState('No tests on the bench', 'Pick a strategy, define the period, and log what the rules would have done.', 'Start a test', 'run.new')}`
  };
};

function benchRunView(runId) {
  const st = S.st, set = st.settings;
  const run = st.runs.find(r => r.id === runId);
  if (!run) { S.params = {}; return VIEWS.bench(); }
  const list = st.trades.filter(t => t.runId === run.id)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const s = stats(list, set);

  let verdict, vclass;
  if (s.n < 30) { verdict = `Too early. ${s.n} trades tells you almost nothing — anything can look good over 30.`; vclass = 'warn'; }
  else if (s.n < set.minSample) { verdict = `Building. ${s.n} of ${set.minSample}. Keep logging before drawing a conclusion.`; vclass = 'warn'; }
  else if (s.expectancy > 0.1 && s.profitFactor > 1.2) { verdict = `Candidate. Positive expectancy over ${s.n} trades. Forward test on a demo before risking money.`; vclass = 'ok'; }
  else if (s.expectancy > 0) { verdict = `Marginal. The edge is real but thin — costs and slippage could eat all of it.`; vclass = 'warn'; }
  else { verdict = `Negative expectancy over ${s.n} trades. This one does not go live.`; vclass = 'bad'; }

  return {
    title: run.name,
    actions: `<button class="btn sm ghost" data-act="go" data-route="bench">${icon('back')} All tests</button>
              <button class="btn sm" data-act="run.edit" data-id="${run.id}">Edit test</button>`,
    html: `
    <div class="banner ${vclass === 'ok' ? '' : 'warn'}" style="margin-bottom:14px;${vclass === 'ok' ? 'border-color:color-mix(in srgb,var(--up) 40%,transparent);background:var(--up-soft)' : ''}">
      ${icon('bench')}<div><strong>${vclass === 'ok' ? 'Passes the bar.' : vclass === 'bad' ? 'Fails.' : 'Not yet.'}</strong> ${esc(verdict)}</div></div>

    <div class="instr">
      <div class="instr-top"><span class="eyebrow">${esc(strategyName(run.strategyId))} · ${esc(run.market || 'any')} · ${esc(run.timeframe || '—')}</span>
        <div class="spacer"></div><span class="tiny faint mono">${esc(run.from || '?')} → ${esc(run.to || '?')}</span></div>
      <div class="scope">${scope(s.curve)}</div>
      <div class="readout">
        <div class="cell"><span class="k">Net</span><span class="v ${s.totalR >= 0 ? 'up' : 'down'}">${s.n ? fmtR(s.totalR, 1) : '—'}</span></div>
        <div class="cell"><span class="k">Expectancy</span><span class="v">${s.expectancy != null ? fmtR(s.expectancy) : '—'}</span></div>
        <div class="cell"><span class="k">Win rate</span><span class="v">${fmtPct(s.winRate)}</span></div>
        <div class="cell"><span class="k">Payoff</span><span class="v">${s.payoff ? s.payoff.toFixed(2) : '—'}</span></div>
        <div class="cell"><span class="k">Max DD</span><span class="v down">${s.n ? '−' + s.maxDD.toFixed(1) + 'R' : '—'}</span></div>
        <div class="cell"><span class="k">Worst run</span><span class="v">${s.worstLossStreak || 0}L</span></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h"><span class="eyebrow">Fast entry</span><div class="spacer"></div>
        <button class="btn sm ghost" data-act="trade.new" data-run="${run.id}">Full form</button></div>
      <form id="quickForm" class="fgrid" style="align-items:end">
        ${field('Date', inp('date', todayISO(), 'type="date"'))}
        ${field('Instrument', inp('instrument', run.market || '', 'list="instrList2"'))}
        ${field('Direction', sel('direction', 'Long', ['Long', 'Short']))}
        ${field('Result R', inp('rManual', '', 'type="number" step="any" inputmode="decimal" placeholder="e.g. 2 or -1"'))}
        ${field('Note', inp('notes', '', 'placeholder="optional"'))}
        <button type="submit" class="btn primary">${icon('plus')} Add</button>
      </form>
      <datalist id="instrList2">${[...new Set(st.trades.map(x => x.instrument).filter(Boolean))].map(i => `<option value="${esc(i)}">`).join('')}</datalist>
    </div>

    <div class="card" style="margin-top:14px;padding:6px 10px">
      ${list.length ? `<div class="scroll-x"><table class="tbl">
        <thead><tr><th>Date</th><th>Instrument</th><th class="opt">Dir</th><th class="num">R</th><th class="opt">Note</th></tr></thead>
        <tbody>${list.map(t => { const r = tradeR(t); return `<tr data-act="trade.open" data-id="${t.id}">
          <td class="mono tiny">${fmtDate(t.date)}</td><td><strong>${esc(t.instrument || '—')}</strong></td>
          <td class="opt tiny ${t.direction === 'Short' ? 'down' : 'up'}">${esc(t.direction || '')}</td>
          <td class="num ${r == null ? 'faint' : r >= 0 ? 'up' : 'down'}">${fmtR(r)}</td>
          <td class="opt tiny muted">${esc((t.notes || '').slice(0, 60))}</td></tr>`; }).join('')}</tbody></table></div>`
        : emptyState('No sample yet', 'Use fast entry above. One row per trade the rules would have taken.', null)}
    </div>

    ${run.notes ? `<div class="card" style="margin-top:14px"><div class="card-h"><span class="eyebrow">Test notes</span></div>
      <p class="small muted" style="margin:0;white-space:pre-wrap">${esc(run.notes)}</p></div>` : ''}`,
    after() {
      $('#quickForm')?.addEventListener('submit', e => {
        e.preventDefault();
        const v = formData(e.target);
        if (num(v.rManual) === null) return toast('Enter the result in R.');
        S.st.trades.push({
          id: uid(), mode: 'backtest', runId: run.id, date: v.date, time: '', session: '',
          instrument: v.instrument, direction: v.direction, strategyId: run.strategyId,
          timeframe: run.timeframe || '', entry: '', stop: '', target: '', exit: '',
          rManual: v.rManual, status: 'Closed', notes: v.notes, tags: [], mistakes: [],
          rulesChecked: [], rulesFollowed: [], rulesTotal: 0
        });
        markDirty(); render();
      });
    }
  };
}

/* ---------- PLAYBOOK ---------- */
VIEWS.playbook = () => {
  const st = S.st, set = st.settings;
  const rows = st.strategies.map(s => {
    const live = st.trades.filter(t => t.strategyId === s.id && (t.mode || 'live') === 'live');
    const bt = st.trades.filter(t => t.strategyId === s.id && (t.mode || 'live') === 'backtest');
    return { s, live: stats(live, set), bt: stats(bt, set) };
  });
  const famMode = S.params.mode || 'all';
  const famPool = famMode === 'all' ? st.trades : st.trades.filter(t => (t.mode || 'live') === famMode);
  const famRows = groupStats(famPool.filter(t => t.strategyId), t => familyOf(t.strategyId), set);

  return {
    title: 'Playbook',
    actions: `<button class="btn sm ghost" data-act="plan.edit">Trading plan</button>
              <button class="btn primary" data-act="strategy.new">${icon('plus')} Add strategy</button>`,
    html: `

      <div class="card-h"><span class="eyebrow">Trading plan</span><div class="spacer"></div>
        <button class="btn sm ghost" data-act="plan.edit">${icon('edit')} Edit</button></div>
      ${st.plan ? `<div class="small muted" style="white-space:pre-wrap;line-height:1.65">${esc(st.plan)}</div>`
        : `<p class="small muted" style="margin:0">Empty. Write what you trade, when you trade it, how much you risk, and what makes you stop for the day. One page is plenty — it only has to be specific enough that someone else could follow it.</p>`}
    </div>

    ${famRows.length ? `<div class="card" style="margin-bottom:16px">
